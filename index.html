document.addEventListener("click", (ev) => {
  const b = ev.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act, v = b.dataset.v, id = b.dataset.id;
  const sh = el("sheet");
  switch (a) {
    case "pinKey": pinPush(v); break;
    case "pinDel": if (!LockUI.busy && LockUI.entry) { LockUI.entry = LockUI.entry.slice(0, -1); paintDots(); lockErr(""); } break;
    case "pinBio": tryBio(false); break;
    case "pinRestart": LockUI.entry = ""; LockUI.first = ""; LockUI.mode = "set"; render(); break;
    case "pinForgot":
      openSheet("نسيت الرمز؟",
        '<p class="sub" style="margin:0 0 14px">بياناتك متشفّرة بالرمز، فمفيش طريقة نفتحها من غيره — ولا إحنا نقدر. اللي تقدر تعمله إنك تبدأ من جديد وترجّع آخر نسخة احتياطية عندك.</p>' +
        '<div class="btnrow" style="flex-direction:column;align-items:stretch">' +
        '<button class="btn danger block" data-act="wipeAndStart">' + ico("trash") + "ابدأ من جديد وامسح كل حاجة</button>" +
        '<button class="btn ghost block" data-act="closeSheet">رجعني أجرب الرمز</button></div>');
      break;
    case "wipeAndStart":
      try { localStorage.removeItem(LS); localStorage.removeItem(LS_LOCK); } catch (_) { }
      Lock.on = false; Lock.key = null; Lock.cfg = null; Lock.unlocked = true;
      state.settings.onboarded = false; state.txs = []; state.goals = [];
      state.wallets = JSON.parse(JSON.stringify(DEFAULT_WALLETS));
      state.categories = JSON.parse(JSON.stringify(DEFAULT_CATS));
      closeSheet(); render(); toast("ابدأ من جديد — ترجّع نسختك من الإعدادات");
      break;
    case "lockSetup":
      if (!hasCrypto()) return toast("المتصفح ده مش بيدعم التشفير — جرّب كروم أو سفاري");
      closeSheet(); LockUI.mode = "set"; LockUI.entry = ""; LockUI.first = ""; Lock.unlocked = false; Lock.on = true; Lock.cfg = null; render();
      break;
    case "lockOff":
      openSheet("تقفل القفل؟",
        '<p class="sub" style="margin:0 0 14px">التطبيق هيفتح على طول من غير رمز، والبيانات هتترجع من غير تشفير على الجهاز.</p>' +
        '<div class="btnrow"><button class="btn" style="flex:1" data-act="closeSheet">سيبه شغال</button>' +
        '<button class="btn danger" data-act="lockOffDo">اقفله</button></div>');
      break;
    case "lockOffDo": disableLock().then(() => { closeSheet(); render(); toast("القفل اتقفل"); }); break;
    case "bioOn":
      (async () => {
        try { await attachBio(LockUI.first || sh.dataset.pin || ""); closeSheet(); render(); toast("البصمة اتفعّلت"); }
        catch (e) { toast("مقدرناش نفعّل البصمة على الجهاز ده"); }
      })();
      break;
    case "bioOff": detachBio(); closeSheet(); render(); toast("البصمة اتلغت"); break;
    case "bioAsk": sheetBioAsk(); break;
    case "bioPinOk":
      (async () => {
        const pin = (el("bioPin").value || "").trim();
        if (!/^\d{4}$/.test(pin)) return toast("اكتب الرمز، 4 أرقام");
        const cfg = Lock.cfg;
        try { await decJSON(await deriveKey(pin, cfg.salt, cfg.iter), cfg.check); }
        catch (_) { return toast("الرمز غلط"); }
        try { await attachBio(pin); closeSheet(); render(); toast("البصمة اتفعّلت"); }
        catch (e) { toast("الجهاز ده مش بيدعم البصمة، أو الطلب اتلغى"); }
      })();
      break;
    case "tab": state.ui.tab = v; render(); window.scrollTo({ top: 0, behavior: "smooth" }); break;
    case "mprev": state.ui.mk = mkShift(state.ui.mk, -1); render(); break;
    case "mnext": if (state.ui.mk < thisMK()) { state.ui.mk = mkShift(state.ui.mk, 1); render(); } break;
    case "goTx": state.ui.tab = "tx"; render(); window.scrollTo({ top: 0, behavior: "smooth" }); break;
    case "goStats": state.ui.tab = "stats"; state.ui.period = "month"; state.ui.mk = thisMK(); render(); window.scrollTo({ top: 0, behavior: "smooth" }); break;
    case "goGoals": state.ui.tab = "goals"; render(); break;
    case "filter": state.ui.filter = v; render(); break;
    case "wfilter": state.ui.wallet = v; render(); break;
    case "allTips": sheetTips(); break;
    case "closeSheet": closeSheet(); break;
    case "newTx": sheetTx(); break;
    case "editTx": sheetTx(id); break;
    case "txType": sh.dataset.type = v; sh.querySelectorAll('[data-act="txType"]').forEach(x => x.setAttribute("aria-pressed", String(x.dataset.v === v))); paintTxForm(); break;
    case "pickCat": sh.dataset.cat = v; paintTxForm(); break;

      paintTxForm();
      break;
    }
    case "newSub": { const pid = v; closeSheet(); setTimeout(() => { sheetCat(null, pid); const t = el("sheet"); if (t) t.dataset.backTx = "1"; }, 180); break; }
    case "pickWallet": sh.dataset.wallet = v; paintTxForm(); break;
    case "pickTo": sh.dataset.towallet = v; paintTxForm(); break;
    case "splitToggle": {
      const box = el("splitBox"), on = box.hidden;
      box.hidden = !on; sh.dataset.split = on ? "1" : "";
      el("splitBtn").innerHTML = ico(on ? "x" : "users") + (on ? "ألغي التقسيم" : "الحساب ده فيه ناس تانية");
      if (on) {
        if (!el("splitRows").children.length) splitAdd("", "");
        splitSum();
        setTimeout(() => { const n = document.querySelector("#splitRows .sp-name"); if (n) n.focus(); }, 60);
      }

  state.categories = JSON.parse(JSON.stringify(DEFAULT_CATS));
  state.wallets = JSON.parse(JSON.stringify(DEFAULT_WALLETS));
  state.txs = []; state.goals = []; state.debts = [];
  state.ui = { tab: "home", mk: thisMK(), day: todayISO(), year: todayISO().slice(0, 4), period: "month", filter: "all", wallet: "all", statW: "all", q: "" };
  writeLocal();
  if (Store.db) {
    try {
      await Store.db.doc("app/settings").set(state.settings);
      await Store.db.doc("app/wallets").set({ list: state.wallets });
      await Store.db.doc("app/categories").set({ list: state.categories });
      await Store.db.doc("app/goals").set({ list: [] });
      await Store.db.doc("app/debts").set({ list: [] });
      for (const mk of mks) await Store.db.doc("months/" + mk).delete();
    } catch (_) { }
  }
  closeSheet(); render(); toast("اتمسح كل حاجة");
}

/* ---------- boot ---------- */
document.documentElement.setAttribute("dir", "rtl");
document.documentElement.setAttribute("lang", "ar");
el("fab").innerHTML = ico("plus");

(function boot() {
  swSetup();
  const cfg = readLockCfg();
  if (cfg && hasCrypto()) {
    Lock.on = true; Lock.cfg = cfg; Lock.unlocked = false;
    LockUI.mode = "unlock";
    render();
    if (cfg.bio) setTimeout(() => { tryBio(true); }, 350);
    return;
  }
  readLocal();
  render();
  connect();
})();

let bioTried = false;
async function tryBio(auto) {
  if (bioTried && auto) return;
  bioTried = true;
  try {
    const ok = await unlockWithBio();
    if (ok) { LockUI.entry = ""; render(); connect(); }
    else if (!auto) lockErr("مقدرناش نتأكد من البصمة");
  } catch (e) { if (!auto) lockErr("البصمة مش شغالة دلوقتي — استخدم الرمز"); }
}
</script>
