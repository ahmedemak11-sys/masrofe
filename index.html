<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="مصروفي — تطبيق عربي لتتبع المصاريف وحدود الصرف وخطط الادخار. بيشتغل من غير نت وبياناتك على جهازك.">
<meta name="theme-color" content="#0D6470">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="مصروفي">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-family:system-ui,sans-serif;font-size:14px;background:#fcfcfb}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>مصروفي</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#EDF0F1; --surface:#FFFFFF; --surface-2:#F4F6F7; --surface-3:#E6EBEC;
  --ink:#141C1F; --ink-2:#3C4A4F; --muted:#5F7075; --line:#DBE2E4;
  --accent:#0D6470; --accent-ink:#FFFFFF; --accent-soft:#D8EBEE; --accent-line:#9CC9CF;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --up:#12772F; --down:#BE3B32;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948; --s9:#6b7a80;
  --track:#E3E9EA;
  --shadow-sm:0 1px 2px rgba(16,34,40,.07);
  --shadow:0 1px 2px rgba(16,34,40,.06), 0 10px 26px -16px rgba(16,34,40,.35);
  --r:16px; --r-sm:10px;
  --ff-display:"Readex Pro","IBM Plex Sans Arabic","Segoe UI",system-ui,sans-serif;
  --ff-body:"IBM Plex Sans Arabic","Readex Pro","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1315; --surface:#161D20; --surface-2:#1C2428; --surface-3:#232D32;
    --ink:#E8EEF0; --ink-2:#C2CED2; --muted:#8FA1A7; --line:#27343A;
    --accent:#43B3C0; --accent-ink:#06282D; --accent-soft:#12343A; --accent-line:#2A5A61;
    --up:#4ECB77; --down:#F08A82;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
    --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767; --s9:#7d8d94;
    --track:#242F34;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 28px -18px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1315; --surface:#161D20; --surface-2:#1C2428; --surface-3:#232D32;
  --ink:#E8EEF0; --ink-2:#C2CED2; --muted:#8FA1A7; --line:#27343A;
  --accent:#43B3C0; --accent-ink:#06282D; --accent-soft:#12343A; --accent-line:#2A5A61;
  --up:#4ECB77; --down:#F08A82;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767; --s9:#7d8d94;
  --track:#242F34;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 28px -18px rgba(0,0,0,.9);
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--ff-body); font-size:15px; line-height:1.55;
  direction:rtl; text-align:right;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
button,input,select,textarea{font-family:inherit; font-size:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px}
.num{font-variant-numeric:tabular-nums; direction:ltr; unicode-bidi:isolate; display:inline-block}

/* ---------- shell ---------- */
.shell{max-width:620px; margin-inline:auto; min-height:100%; padding-inline:16px;
  padding-block:0 108px; background:var(--bg)}
.topbar{position:sticky; top:env(safe-area-inset-top,0px); z-index:30;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:saturate(1.4) blur(10px);
  display:flex; align-items:center; gap:10px; padding-block:12px 10px;
  border-bottom:1px solid transparent; margin-inline:-16px; padding-inline:16px}
.topbar.scrolled{border-bottom-color:var(--line)}
.brand{font-family:var(--ff-display); font-weight:700; font-size:19px; letter-spacing:-.01em; margin-inline-end:auto; display:flex; align-items:center; gap:8px}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent)}
.iconbtn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);
  background:var(--surface); display:grid; place-items:center; color:var(--ink-2); box-shadow:var(--shadow-sm)}
.iconbtn:hover{border-color:var(--accent-line); color:var(--accent)}
.iconbtn svg{width:19px;height:19px}

.monthbar{display:flex; align-items:center; justify-content:space-between; gap:8px;
  background:var(--surface); border:1px solid var(--line); border-radius:12px;
  padding:6px 8px; margin-block:2px 14px; box-shadow:var(--shadow-sm)}
.monthbar b{font-family:var(--ff-display); font-weight:600; font-size:15px}
.monthbar .mnav{width:32px;height:32px;border-radius:9px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center}
.monthbar .mnav:hover{background:var(--surface-3); color:var(--ink)}
.monthbar .mnav svg{width:17px;height:17px}
.monthbar .mnav[disabled]{opacity:.3; pointer-events:none}

/* ---------- typography ---------- */
h2.sec{font-family:var(--ff-display); font-size:15px; font-weight:600; margin:22px 0 10px;
  display:flex; align-items:center; gap:8px; text-wrap:balance}
h2.sec .hint{font-family:var(--ff-body); font-size:12px; font-weight:400; color:var(--muted); margin-inline-start:auto}
.lbl{font-size:11.5px; font-weight:600; letter-spacing:.06em; color:var(--muted); text-transform:uppercase}
.sub{color:var(--muted); font-size:13px}

/* ---------- cards ---------- */
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow-sm)}
.pad{padding:16px}
.stack{display:flex; flex-direction:column; gap:12px}
.row{display:flex; align-items:center; gap:10px}

/* hero */
.hero{background:linear-gradient(160deg, var(--accent) 0%, color-mix(in srgb,var(--accent) 72%, #000) 100%);
  color:#fff; border-radius:20px; padding:18px 18px 16px; box-shadow:var(--shadow); position:relative; overflow:hidden;
  display:block; width:100%; text-align:right; border:0; font:inherit}
.hero .cap{display:flex; align-items:center; gap:6px}
.hero .heroedit{width:14px;height:14px;opacity:.75;flex:none}
.hero:hover .heroedit{opacity:1}
.hero::after{content:""; position:absolute; inset:auto -40px -70px auto; width:190px; height:190px;
  border-radius:50%; background:rgba(255,255,255,.07)}
.hero .cap{font-size:12.5px; opacity:.88}
.hero .big{font-family:var(--ff-display); font-weight:700; font-size:34px; line-height:1.15; margin-top:4px; letter-spacing:-.02em}
.hero .cur{font-size:16px; opacity:.8; font-weight:500}
.hero .split{display:flex; gap:10px; margin-top:16px; position:relative; z-index:1}
.hero .qt{flex:1; background:rgba(255,255,255,.12); border-radius:12px; padding:9px 11px}
.hero .qt .k{font-size:11.5px; opacity:.85}
.hero .qt .v{font-family:var(--ff-display); font-weight:600; font-size:16px; margin-top:1px}

/* tiles */
.tiles{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; align-items:stretch}
.tile{background:var(--surface); border:1px solid var(--line); border-radius:13px; padding:11px 12px;
  display:flex; flex-direction:column; justify-content:space-between; min-height:74px}
.tile .k{font-size:11.5px; color:var(--muted); display:flex; align-items:center; gap:5px; line-height:1.35}
.tile .k span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.tile .v{font-family:var(--ff-display); font-weight:600; font-size:17px; margin-top:6px; letter-spacing:-.01em}
.tile .v.up{color:var(--up)} .tile .v.down{color:var(--down)}
.tile .k svg{width:13px;height:13px;flex:none}
.ftrow{display:flex; justify-content:space-between; gap:10px; font-size:12px; color:var(--muted)}
@media(max-width:380px){ .tiles{grid-template-columns:repeat(2,1fr)} }

/* allowance strip */
.allow{display:flex; align-items:center; gap:12px; padding:13px 14px; border-radius:14px;
  background:var(--accent-soft); border:1px solid var(--accent-line); color:var(--ink)}
.allow .ic{width:38px;height:38px;border-radius:11px;background:var(--surface);display:grid;place-items:center;color:var(--accent);flex:none;border:1px solid var(--accent-line)}
.allow .ic svg{width:20px;height:20px}
.allow .v{font-family:var(--ff-display); font-weight:700; font-size:19px; line-height:1.2}
.allow .t{font-size:12px; color:var(--ink-2)}

/* progress */
.bar{height:8px; border-radius:99px; background:var(--track); overflow:hidden; position:relative}
.bar > i{display:block; height:100%; border-radius:99px; background:var(--accent); transition:width .35s ease}
.bar.thin{height:6px}
.bar > i.ok{background:var(--good)} .bar > i.warn{background:var(--warn)} .bar > i.over{background:var(--crit)}

/* list rows */
.list{display:flex; flex-direction:column}
.item{display:flex; align-items:center; gap:11px; padding:11px 14px; border-bottom:1px solid var(--line);
  background:transparent; border-top:0; border-inline:0; width:100%; text-align:right}
.item:last-child{border-bottom:0}
.item:hover{background:var(--surface-2)}
.ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none}
.ic svg{width:19px;height:19px}
.item .nm{font-weight:500; font-size:14.5px}
.item .mt{font-size:12px; color:var(--muted); margin-top:1px}
.item .amt{margin-inline-start:auto; font-family:var(--ff-display); font-weight:600; font-size:15px; white-space:nowrap}
.amt.up{color:var(--up)} .amt.down{color:var(--ink)}

.daygroup{padding:9px 14px; background:var(--surface-2); border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted); font-weight:500}
.daygroup .tot{margin-inline-start:auto; font-variant-numeric:tabular-nums}

/* budget rows */
.bud{padding:13px 14px; border-bottom:1px solid var(--line)}
.bud:last-child{border-bottom:0}
.bud .hd{display:flex; align-items:center; gap:10px; margin-bottom:9px}
.bud .nm{font-weight:500}
.bud .rt{margin-inline-start:auto; text-align:left; font-size:12.5px; color:var(--muted); line-height:1.3; flex:none}
.bud .rt b{font-family:var(--ff-display); font-size:15px; color:var(--ink); font-weight:600; display:block; font-variant-numeric:tabular-nums}
.bud .rt small{font-size:11.5px; white-space:nowrap; font-variant-numeric:tabular-nums}
.bud .nm{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.bud .ft{display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-top:7px; gap:8px}

/* pills */
.pill{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600;
  padding:3px 9px; border-radius:99px; border:1px solid transparent; white-space:nowrap}
.pill svg{width:13px;height:13px;flex:none}
.pill.good{background:color-mix(in srgb,var(--good) 14%, var(--surface)); color:var(--up); border-color:color-mix(in srgb,var(--good) 32%, transparent)}
.pill.warn{background:color-mix(in srgb,var(--warn) 20%, var(--surface)); color:color-mix(in srgb,var(--warn) 70%, var(--ink)); border-color:color-mix(in srgb,var(--warn) 45%, transparent)}
.pill.crit{background:color-mix(in srgb,var(--crit) 14%, var(--surface)); color:var(--down); border-color:color-mix(in srgb,var(--crit) 32%, transparent)}
.pill.flat{background:var(--surface-3); color:var(--muted); border-color:var(--line)}

/* insights */
.tip{display:flex; gap:11px; padding:12px 14px; border-bottom:1px solid var(--line)}
.tip:last-child{border-bottom:0}
.tip .bullet{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none}
.tip .bullet svg{width:16px;height:16px}
.tip h4{margin:0 0 2px; font-size:14px; font-weight:600; font-family:var(--ff-display)}
.tip p{margin:0; font-size:13px; color:var(--ink-2); line-height:1.5}

/* goals */
.goal{padding:14px; border-bottom:1px solid var(--line)}
.goal:last-child{border-bottom:0}
.ringwrap{display:flex; gap:14px; align-items:center}
.ring{width:66px;height:66px;flex:none}
.goal .gname{font-family:var(--ff-display); font-weight:600; font-size:15.5px}
.goal .gmeta{font-size:12.5px; color:var(--muted); margin-top:2px}
.plan{margin-top:11px; background:var(--surface-2); border:1px solid var(--line); border-radius:11px; padding:10px 12px; font-size:13px; line-height:1.6}
.plan b{font-family:var(--ff-display); color:var(--accent)}

/* buttons */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:7px;
  border-radius:12px; border:1px solid var(--line); background:var(--surface);
  padding:10px 15px; font-weight:600; font-size:14px; color:var(--ink); box-shadow:var(--shadow-sm)}
.btn:hover{border-color:var(--accent-line)}
.btn svg{width:17px;height:17px}
.btn.pri{background:var(--accent); color:var(--accent-ink); border-color:transparent}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent; box-shadow:none}
.btn.danger{color:var(--down); border-color:color-mix(in srgb,var(--crit) 35%, var(--line))}
.btn.block{width:100%}
.btn[disabled]{opacity:.5; pointer-events:none}
.btnrow{display:flex; gap:9px; flex-wrap:wrap}

/* forms */
.field{display:flex; flex-direction:column; gap:6px; margin-bottom:13px}
.field > label{font-size:12.5px; font-weight:600; color:var(--ink-2)}
.inp{width:100%; padding:11px 13px; border-radius:12px; border:1px solid var(--line);
  background:var(--surface-2); color:var(--ink); font-size:15px}
.inp:focus{outline:none; border-color:var(--accent); background:var(--surface)}
input.inp[type=number]{direction:ltr; text-align:right; font-variant-numeric:tabular-nums}
.inp.big{font-family:var(--ff-display); font-size:26px; font-weight:700; padding:14px; letter-spacing:-.01em}
.inp.big::placeholder{font-weight:600; opacity:.35}
input.inp[type=date]{direction:ltr; text-align:right}
textarea.inp{resize:vertical; min-height:62px}
.segs{display:flex; gap:6px; background:var(--surface-2); padding:4px; border-radius:13px; border:1px solid var(--line)}
.segs button{flex:1; border:0; background:transparent; padding:9px 4px; border-radius:10px; font-weight:600; font-size:13.5px; color:var(--muted); white-space:nowrap}
.segs button[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:var(--shadow-sm)}
.segs button[aria-pressed="true"][data-v="income"]{color:var(--up)}
.segs button[aria-pressed="true"][data-v="expense"]{color:var(--down)}
.chips{display:flex; flex-wrap:wrap; gap:7px}
.chip{display:inline-flex; align-items:center; gap:6px; padding:7px 11px; border-radius:11px;
  border:1px solid var(--line); background:var(--surface-2); font-size:13px; font-weight:500}
.chip svg{width:15px;height:15px}
.chip[aria-pressed="true"]{border-color:currentColor; background:var(--surface)}
.keypad{display:grid; grid-template-columns:repeat(4,1fr); gap:7px}
.keypad button{padding:8px 0; border-radius:10px; border:1px solid var(--line); background:var(--surface-2); font-size:13px; font-weight:600; color:var(--ink-2)}

/* tabbar + fab */
.dock{position:fixed; bottom:0; left:50%; transform:translateX(-50%);
  width:min(620px,100%); pointer-events:none; z-index:40}
.tabbar{pointer-events:auto; display:flex; gap:2px; margin:0 12px;
  background:color-mix(in srgb,var(--surface) 92%, transparent); backdrop-filter:blur(12px) saturate(1.5);
  border:1px solid var(--line); border-radius:18px; padding:6px;
  margin-bottom:calc(10px + env(safe-area-inset-bottom,0px)); box-shadow:var(--shadow)}
.tabbar button{flex:1; border:0; background:transparent; border-radius:13px;
  display:flex; flex-direction:column; align-items:center; gap:3px; padding:7px 2px 6px; color:var(--muted); font-size:10.5px; font-weight:600}
.tabbar button svg{width:20px;height:20px}
.tabbar button[aria-current="true"]{background:var(--accent-soft); color:var(--accent)}
.fab{pointer-events:auto; position:absolute; bottom:calc(76px + env(safe-area-inset-bottom,0px)); inset-inline-start:18px;
  width:54px; height:54px; border-radius:18px; border:0; background:var(--accent); color:var(--accent-ink);
  display:grid; place-items:center; box-shadow:0 8px 22px -8px color-mix(in srgb,var(--accent) 75%, transparent), var(--shadow)}
.fab svg{width:25px;height:25px}
.fab:hover{filter:brightness(1.08)}

/* sheet */
.backdrop{position:fixed; inset:0; z-index:50; background:rgba(8,18,21,.45); backdrop-filter:blur(2px);
  display:flex; align-items:flex-end; justify-content:center}
.sheet{width:min(620px,100%); max-height:92vh; overflow-y:auto; background:var(--surface);
  border-radius:22px 22px 0 0; border:1px solid var(--line); border-bottom:0;
  padding:0 16px calc(20px + env(safe-area-inset-bottom,0px));
  animation:rise .24s cubic-bezier(.2,.8,.3,1)}
@keyframes rise{from{transform:translateY(22px); opacity:.6} to{transform:none; opacity:1}}
@media(prefers-reduced-motion:reduce){ .sheet{animation:none} .bar > i{transition:none} }
.sheet .grip{width:40px;height:4px;border-radius:99px;background:var(--line);margin:9px auto 4px}
.sheet .shd{position:sticky; top:0; background:var(--surface); z-index:2; display:flex; align-items:center; gap:10px; padding:6px 0 12px}
.sheet .shd h3{margin:0; font-family:var(--ff-display); font-size:17px; font-weight:600}
.sheet .shd .x{margin-inline-start:auto}

/* charts */
.chartbox{position:relative}
.chartbox svg{width:100%; height:auto; display:block; overflow:visible}
#donutBox{max-width:250px; margin-inline:auto}
.legend{display:flex; flex-wrap:wrap; gap:8px 14px; margin-top:12px}
.legend .li{display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--ink-2)}
.legend .sw{width:10px;height:10px;border-radius:3px;flex:none}
.legend .va{color:var(--muted); font-variant-numeric:tabular-nums}
.tt{position:absolute; pointer-events:none; z-index:5; background:var(--surface); border:1px solid var(--line);
  border-radius:10px; box-shadow:var(--shadow); padding:7px 10px; font-size:12.5px; white-space:nowrap;
  transform:translate(-50%,-115%); opacity:0; transition:opacity .12s}
.tt.on{opacity:1}
.tt .tk{color:var(--muted); font-size:11px}
.tt .tv{font-family:var(--ff-display); font-weight:600}

/* table view */
.tbl{width:100%; border-collapse:collapse; font-size:13px}
.tbl th,.tbl td{padding:7px 9px; border-bottom:1px solid var(--line); text-align:right}
.tbl th{color:var(--muted); font-weight:600; font-size:11.5px}
.tbl td.n{font-variant-numeric:tabular-nums}
.tblwrap{overflow-x:auto}
details.more{margin-top:10px}
details.more summary{cursor:pointer; font-size:12.5px; color:var(--accent); font-weight:600; list-style:none}
details.more summary::-webkit-details-marker{display:none}

/* empty */
.empty{text-align:center; padding:30px 18px; color:var(--muted)}
.empty .eic{width:52px;height:52px;border-radius:16px;background:var(--surface-2);display:grid;place-items:center;margin:0 auto 12px;color:var(--accent)}
.empty .eic svg{width:24px;height:24px}
.empty h4{margin:0 0 5px; font-family:var(--ff-display); font-size:15px; color:var(--ink); font-weight:600}
.empty p{margin:0 auto; max-width:34ch; font-size:13px; line-height:1.6}

/* onboarding */
.ob{padding:6px 0 10px}
.ob .obhead{text-align:center; padding:14px 0 18px}
.ob .obhead .mark{width:58px;height:58px;border-radius:19px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin:0 auto 12px}
.ob .obhead .mark svg{width:28px;height:28px}
.ob h1{font-family:var(--ff-display); font-size:23px; margin:0 0 6px; font-weight:700; letter-spacing:-.02em}

<script>
/* ============================ مصروفي ============================ */
"use strict";

/* ---------- helpers ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const el = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const clamp = (n, a, b) => Math.min(b, Math.max(a, n));
const uid = (p) => p + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const nf = (n, d) => new Intl.NumberFormat("en-US", { maximumFractionDigits: d == null ? ((Math.abs(n) < 1000 && Math.abs(n % 1) > 0.004) ? 2 : 0) : d, minimumFractionDigits: 0 }).format(n || 0);
const N = (n, d) => '<span class="num">' + nf(n, d) + "</span>";
const money = (n, d) => '<span class="num">' + nf(n, d) + "</span> " + esc(state.settings.currency);
const money2 = (n) => nf(n) + " " + state.settings.currency;

const AR_MONTHS = ["يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو", "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"];
const AR_MONTHS_SHORT = ["ينا", "فبر", "مار", "أبر", "مايو", "يون", "يول", "أغس", "سبت", "أكت", "نوف", "ديس"];
const AR_DAYS = ["الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];

const todayISO = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const mkOf = (iso) => iso.slice(0, 7);
const thisMK = () => todayISO().slice(0, 7);
const mkLabel = (mk) => AR_MONTHS[+mk.slice(5, 7) - 1] + " " + mk.slice(0, 4);
const mkShift = (mk, n) => { let y = +mk.slice(0, 4), m = +mk.slice(5, 7) - 1 + n; y += Math.floor(m / 12); m = ((m % 12) + 12) % 12; return y + "-" + String(m + 1).padStart(2, "0"); };
const daysIn = (mk) => new Date(+mk.slice(0, 4), +mk.slice(5, 7), 0).getDate();
const dayLabel = (iso) => { const d = new Date(iso + "T00:00:00"); const t = todayISO(); if (iso === t) return "النهاردة"; if (iso === shiftDay(t, -1)) return "إمبارح"; return AR_DAYS[d.getDay()] + " " + d.getDate() + " " + AR_MONTHS[d.getMonth()]; };
function shiftDay(iso, n) { const d = new Date(iso + "T00:00:00"); d.setDate(d.getDate() + n); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function monthsBetween(aISO, bISO) { const a = new Date(aISO + "T00:00:00"), b = new Date(bISO + "T00:00:00"); return (b.getFullYear() - a.getFullYear()) * 12 + (b.getMonth() - a.getMonth()) + (b.getDate() >= a.getDate() ? 0 : -1); }
function daysBetween(aISO, bISO) { return Math.round((new Date(bISO + "T00:00:00") - new Date(aISO + "T00:00:00")) / 86400000); }

/* ---------- icons ---------- */
const P = {
  food: '<path d="M4 11h16a8 8 0 0 1-16 0z"/><path d="M7 7.2c0-1.1 1-1.5 1-2.7"/><path d="M11 7.2c0-1.1 1-1.5 1-2.7"/><path d="M15 7.2c0-1.1 1-1.5 1-2.7"/><path d="M3 20h18"/>',

  book: '<path d="M4 5.6A2.6 2.6 0 0 1 6.6 3H19v15.4H6.6A2.6 2.6 0 0 0 4 21z"/><path d="M4 21V5.6"/>',
  dots: '<circle cx="6" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="18" cy="12" r="1.4" fill="currentColor" stroke="none"/>',
  wallet: '<rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10.2h18"/><circle cx="16.8" cy="14.6" r="1.25" fill="currentColor" stroke="none"/>',
  spark: '<path d="M12 3.2 13.8 8.4 19 10.2 13.8 12 12 17.2 10.2 12 5 10.2 10.2 8.4z"/>',
  gift: '<rect x="3.4" y="8.4" width="17.2" height="11.6" rx="2.2"/><path d="M3.4 12.4h17.2"/><path d="M12 8.4V20"/><path d="M12 8.4S9.6 4.6 7.7 5.7 9.2 8.4 12 8.4zM12 8.4s2.4-3.8 4.3-2.7S14.8 8.4 12 8.4z"/>',
  plus: '<path d="M12 5.2v13.6"/><path d="M5.2 12h13.6"/>',
  gear: '<circle cx="12" cy="12" r="3.1"/><path d="M12 2.6l1.4 2.2 2.6-.4.6 2.6 2.4 1-.9 2.5 1.7 2-1.7 2 .9 2.5-2.4 1-.6 2.6-2.6-.4L12 21.4l-1.4-2.2-2.6.4-.6-2.6-2.4-1 .9-2.5-1.7-2 1.7-2-.9-2.5 2.4-1 .6-2.6 2.6.4z"/>',
  chevR: '<path d="M9.5 5 16 12l-6.5 7"/>',
  chevL: '<path d="M14.5 5 8 12l6.5 7"/>',
  tabHome: '<path d="M4 10.5 12 4l8 6.5V20H4z"/><path d="M9.5 20v-5.2h5V20"/>',

  tabShield: '<path d="M12 3.2 19 6v6c0 4.4-3 7.7-7 8.9-4-1.2-7-4.5-7-8.9V6z"/><path d="M9.3 12.1l1.9 1.9 3.5-3.7"/>',
  tabTarget: '<circle cx="12" cy="12" r="8.4"/><circle cx="12" cy="12" r="4.4"/><circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"/>',
  tabChart: '<path d="M3.2 20h17.6"/><path d="M6.6 20v-5.6"/><path d="M12 20V5.6"/><path d="M17.4 20v-8.8"/>',
  cal: '<rect x="3.2" y="5" width="17.6" height="15.8" rx="3"/><path d="M3.2 10h17.6"/><path d="M8 3.2v3.6"/><path d="M16 3.2v3.6"/>',
  trash: '<path d="M4.2 6.8h15.6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M6.4 6.8 7.4 20.4h9.2l1-13.6"/><path d="M9.2 6.8V3.6h5.6v3.2"/>',
  edit: '<path d="M4 20.2h4.2L20 8.4l-4.2-4.2L4 16z"/><path d="M14.4 5.8l4.2 4.2"/>',
  down: '<path d="M12 3.6v11.6"/><path d="M8 11.2 12 15.2l4-4"/><path d="M4.2 19.6h15.6"/>',
  up: '<path d="M12 20.4V8.8"/><path d="M8 12.8 12 8.8l4 4"/><path d="M4.2 4.4h15.6"/>',
  check: '<path d="M5 12.6 9.6 17.2 19 6.9"/>',
  alert: '<path d="M12 3.8 21 20H3z"/><path d="M12 10v4.2"/><circle cx="12" cy="17.2" r="1" fill="currentColor" stroke="none"/>',
  info: '<circle cx="12" cy="12" r="8.6"/><path d="M12 11.2v5"/><circle cx="12" cy="8" r="1" fill="currentColor" stroke="none"/>',
  tUp: '<path d="M4 16.2 9 11.2l3.4 3.4L20 7"/><path d="M15 7h5v5"/>',
  tDown: '<path d="M4 7.8 9 12.8l3.4-3.4L20 17"/><path d="M15 17h5v-5"/>',
  x: '<path d="M6.4 6.4 17.6 17.6"/><path d="M17.6 6.4 6.4 17.6"/>',
  coins: '<circle cx="9.4" cy="9.4" r="5.6"/><path d="M14.6 6.1a5.6 5.6 0 0 1 0 11.1 5.6 5.6 0 0 1-3.2-1"/><path d="M9.4 7.1v4.6"/><path d="M7.6 8.2h2.6a1.3 1.3 0 0 1 0 2.6H8.4"/>',
  scale: '<path d="M12 4.2v15.6"/><path d="M6.4 6.6h11.2"/><path d="M8.6 6.9 5.4 13h6.4z"/><path d="M15.4 6.9 12.2 13h6.4z"/><path d="M8.4 19.8h7.2"/>',
  percent: '<circle cx="8.2" cy="8.2" r="2.6"/><circle cx="15.8" cy="15.8" r="2.6"/><path d="M18.4 5.6 5.6 18.4"/>',
  bolt: '<path d="M13.2 3 5.6 14h5.6l-1 7 7.6-11h-5.6z"/>',
  clock: '<circle cx="12" cy="12" r="8.6"/><path d="M12 7.2V12l3.4 2"/>',
  pie: '<path d="M12 3.4a8.6 8.6 0 1 0 8.6 8.6H12z"/><path d="M14.6 2.2a8.6 8.6 0 0 1 7.2 7.2h-7.2z"/>',
  flag: '<path d="M6 21V4"/><path d="M6 4.6h11l-2.2 3.8L17 12.2H6z"/>'
};
function ico(n, cls) { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"' + (cls ? ' class="' + cls + '"' : "") + ">" + (P[n] || P.dots) + "</svg>"; }

/* ---------- defaults ---------- */
const DEFAULT_CATS = [
  { id: "c_food", name: "أكل وشرب", icon: "food", color: "s2", pct: 25, limit: 0 },
  { id: "c_trans", name: "مواصلات", icon: "car", color: "s1", pct: 10, limit: 0 },
  { id: "c_home", name: "بيت وإيجار", icon: "home", color: "s7", pct: 25, limit: 0 },
  { id: "c_bills", name: "فواتير وإنترنت", icon: "bill", color: "s4", pct: 8, limit: 0 },
  { id: "c_health", name: "صحة وعلاج", icon: "health", color: "s8", pct: 5, limit: 0 },
  { id: "c_shop", name: "تسوق وملابس", icon: "bag", color: "s5", pct: 7, limit: 0 },
  { id: "c_fun", name: "ترفيه وخروج", icon: "fun", color: "s3", pct: 5, limit: 0 },
  { id: "c_edu", name: "تعليم", icon: "book", color: "s6", pct: 5, limit: 0 },
  { id: "c_other", name: "حاجات تانية", icon: "dots", color: "s9", pct: 5, limit: 0 }
];
const INCOME_CATS = [
  { id: "i_salary", name: "مرتب", icon: "wallet", color: "s6" },
  { id: "i_side", name: "شغل إضافي", icon: "spark", color: "s3" },
  { id: "i_gift", name: "هدية أو مساعدة", icon: "gift", color: "s5" },
  { id: "i_other", name: "دخل تاني", icon: "coins", color: "s9" }
];
const ICON_CHOICES = ["food", "car", "home", "bill", "health", "bag", "fun", "book", "coins", "wallet", "gift", "spark", "flag", "dots"];
const COLOR_CHOICES = ["s1", "s2", "s3", "s4", "s5", "s6", "s7", "s8", "s9"];

const state = {
  settings: { name: "", currency: "ج.م", startBalance: 0, income: 0, savePct: 15, onboarded: false, lastBackup: "" },
  categories: JSON.parse(JSON.stringify(DEFAULT_CATS)),
  txs: [],
  goals: [],
  ui: { tab: "home", mk: thisMK(), filter: "all", q: "" }
};

/* ---------- storage ---------- */
const LS = "masroufy.v1";
const Store = { db: null, mode: "local", warned: false };

function readLocal() {
  try {
    const raw = localStorage.getItem(LS); if (!raw) return false;
    const d = JSON.parse(raw);
    if (d.settings) Object.assign(state.settings, d.settings);
    if (Array.isArray(d.categories) && d.categories.length) state.categories = d.categories;
    if (Array.isArray(d.txs)) state.txs = d.txs;
    if (Array.isArray(d.goals)) state.goals = d.goals;
    return true;
  } catch (e) { return false; }
}
function writeLocal() {
  try { localStorage.setItem(LS, JSON.stringify({ settings: state.settings, categories: state.categories, txs: state.txs, goals: state.goals })); } catch (e) { }
}

const dirty = new Set();
let saveTimer = null, writing = Promise.resolve();
function save() {
  for (const k of arguments) dirty.add(k);
  writeLocal();
  if (!Store.db) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 450);
}
function flush() {
  const keys = [...dirty]; dirty.clear();
  writing = writing.then(async () => {
    for (const k of keys) {
      try { await writeDoc(k); }
      catch (e) {
        if (e && (e.code === "invalid_argument" || e.code === "revoked" || e.code === "not_granted")) { degrade(); return; }
        if (e && e.code === "unavailable") { await new Promise(r => setTimeout(r, 600 + Math.random() * 400)); try { await writeDoc(k); } catch (e2) { degrade(); } }
        else degrade();
      }
    }
  });
}
function writeDoc(k) {
  const db = Store.db;
  if (k === "settings") return db.doc("app/settings").set(state.settings);
  if (k === "categories") return db.doc("app/categories").set({ list: state.categories });
  if (k === "goals") return db.doc("app/goals").set({ list: state.goals });
  if (k.startsWith("m:")) { const mk = k.slice(2); return db.doc("months/" + mk).set({ mk: mk, txs: state.txs.filter(t => mkOf(t.date) === mk) }); }
  return Promise.resolve();
}
function degrade() {
  Store.db = null; Store.mode = "local";
  if (!Store.warned) { Store.warned = true; toast("الحفظ السحابي وقف — البيانات بتتسجل على الجهاز ده"); }
  const s = el("storLine"); if (s) renderStorageLine();
}

async function connect() {
  let db = null;
  try { db = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch (e) { db = null; }
  if (!db) { Store.mode = "local"; renderStorageLine(); return; }
  Store.db = db; Store.mode = "cloud";
  try {
    const [s, c, g, ms] = await Promise.all([
      db.doc("app/settings").get(), db.doc("app/categories").get(), db.doc("app/goals").get(), db.collection("months").get()
    ]);
    const hasCloud = s.exists || c.exists || (ms && ms.size > 0);
    if (hasCloud) {
      if (s.exists) Object.assign(state.settings, s.data());
      const cd = c.exists ? c.data() : null; if (cd && Array.isArray(cd.list) && cd.list.length) state.categories = cd.list;
      const gd = g.exists ? g.data() : null; state.goals = gd && Array.isArray(gd.list) ? gd.list : [];
      const all = [];
      (ms.docs || []).forEach(d => { const v = d.data(); if (v && Array.isArray(v.txs)) all.push.apply(all, v.txs); });
      state.txs = all;
      writeLocal();
    } else if (state.settings.onboarded || state.txs.length) {
      save("settings", "categories", "goals");
      [...new Set(state.txs.map(t => mkOf(t.date)))].forEach(mk => save("m:" + mk));
    }
  } catch (e) { degrade(); }
  render(); renderStorageLine();
}

/* ---------- derived ---------- */
const catById = (id) => state.categories.find(c => c.id === id) || INCOME_CATS.find(c => c.id === id) || { id: id, name: "غير محدد", icon: "dots", color: "s9", limit: 0 };
const txOfMonth = (mk) => state.txs.filter(t => mkOf(t.date) === mk);
function totalsOf(mk) {
  let inc = 0, exp = 0;
  for (const t of state.txs) if (mkOf(t.date) === mk) { if (t.type === "income") inc += t.amount; else exp += t.amount; }
  return { inc: inc, exp: exp, net: inc - exp };
}
function balanceNow() {
  let b = +state.settings.startBalance || 0;
  for (const t of state.txs) b += t.type === "income" ? t.amount : -t.amount;
  const saved = state.goals.reduce((s, g) => s + (g.saved || 0), 0);
  return { total: b, free: b - saved, locked: saved };
}
function spendByCat(mk) {
  const m = {};
  for (const t of state.txs) if (t.type === "expense" && mkOf(t.date) === mk) m[t.catId] = (m[t.catId] || 0) + t.amount;
  return m;
}
const budgetTotal = () => state.categories.reduce((s, c) => s + (+c.limit || 0), 0);
function savingCapacity() {
  const inc = +state.settings.income || 0;
  if (inc <= 0) return 0;
  const bt = budgetTotal();
  const spend = bt > 0 ? bt : totalsOf(mkShift(thisMK(), -1)).exp;
  return Math.max(0, inc - spend);
}
function monthClock(mk) {
  const dim = daysIn(mk), cur = thisMK();
  if (mk < cur) return { dim: dim, day: dim, left: 0, past: true, future: false };
  if (mk > cur) return { dim: dim, day: 0, left: dim, past: false, future: true };
  const d = new Date().getDate();
  return { dim: dim, day: d, left: Math.max(0, dim - d + 1), past: false, future: false };
}
function allowance(mk) {
  const { exp } = totalsOf(mk), ck = monthClock(mk);
  const bt = budgetTotal();
  const base = bt > 0 ? bt : (+state.settings.income || 0) * (1 - (+state.settings.savePct || 0) / 100);
  if (!base) return null;
  const rem = base - exp;
  return { base: base, rem: rem, perDay: ck.left > 0 ? rem / ck.left : 0, left: ck.left, over: rem < 0 };
}
function projected(mk) {
  const { exp } = totalsOf(mk), ck = monthClock(mk);
  if (ck.day < 1) return exp;
  return exp / ck.day * ck.dim;
}
/* goal.mode: "deadline" = لحد تاريخ | "monthly" = مبلغ ثابت | "percent" = نسبة من الدخل */
function goalMode(g) { return g.mode || (g.deadline ? "deadline" : "monthly"); }
function goalStatus(g) {
  const today = todayISO(), mode = goalMode(g);
  const target = +g.target || 0, saved = +g.saved || 0;
  const left = Math.max(0, target - saved);
  const inc = +state.settings.income || 0;

  let need = 0, deadline = g.deadline || "", etaMonths = 0;
  if (mode === "percent") need = inc * (+g.pct || 0) / 100;
  else if (mode === "monthly") need = +g.monthly || 0;

  if (mode === "deadline") {
    const m = deadline ? Math.max(0, monthsBetween(today, deadline)) : 0;
    need = m > 0 ? left / m : left;
    etaMonths = m;
  } else {
    etaMonths = need > 0 ? Math.ceil(left / need) : 0;
    deadline = need > 0 && left > 0 ? mkShift(thisMK(), etaMonths) + "-01" : "";
  }

  const mLeft = deadline ? Math.max(0, monthsBetween(today, deadline)) : etaMonths;
  const dLeft = deadline ? Math.max(0, daysBetween(today, deadline)) : 0;
  const pct = target > 0 ? clamp(saved / target * 100, 0, 100) : 0;

  let expected = 0, gap = 0;
  if (mode === "deadline" && g.deadline && g.startedAt) {
    const totalD = Math.max(1, daysBetween(g.startedAt, g.deadline));
    const goneD = clamp(daysBetween(g.startedAt, today), 0, totalD);
    expected = target * goneD / totalD;
    gap = saved - expected;
  } else if (g.startedAt) {
    const monthsGone = Math.max(0, monthsBetween(g.startedAt, today));

function insights(mk) {

  const T = totalsOf(mk), ck = monthClock(mk), sc = spendByCat(mk), bt = budgetTotal();
  const push = (lv, t, x, ic) => out.push({ lv: lv, t: t, x: x, ic: ic });

  // 1. over / near category limits
  const overs = [], nears = [], paceOvers = [];
  for (const c of state.categories) {
    const lim = +c.limit || 0; if (lim <= 0) continue;
    const sp = sc[c.id] || 0;
    if (sp > lim) overs.push({ c: c, by: sp - lim });
    else if (sp / lim >= 0.8) nears.push({ c: c, rem: lim - sp, p: sp / lim });
    else if (!ck.past && ck.day > 3) { const pr = sp / ck.day * ck.dim; if (pr > lim * 1.05) paceOvers.push({ c: c, pr: pr, lim: lim }); }
  }
  overs.sort((a, b) => b.by - a.by).slice(0, 2).forEach(o =>
    push("crit", "عديت حد " + o.c.name, "صرفت " + money2(sc[o.c.id]) + " والحد اللي حاططه " + money2(o.c.limit) + "، يعني زيادة " + money2(o.by) + ".", "alert"));
  nears.sort((a, b) => b.p - a.p).slice(0, 2).forEach(o =>
    push("warn", "قربت على حد " + o.c.name, "فاضلك " + money2(o.rem) + " بس في البند ده" + (ck.left > 0 ? " و" + ck.left + " يوم على آخر الشهر." : "."), "alert"));
  paceOvers.sort((a, b) => (b.pr - b.lim) - (a.pr - a.lim)).slice(0, 2).forEach(o =>
    push("warn", "معدل الصرف في " + o.c.name + " عالي", "بالمعدل ده هتقفل الشهر على " + money2(o.pr) + " والحد " + money2(o.lim) + ". قلّل حوالي " + money2((o.pr - o.lim) / Math.max(1, ck.left)) + " في اليوم.", "tUp"));

  // 2. spending more than income
  if (T.inc > 0 && T.exp > T.inc)
    push("crit", "بتصرف أكتر من دخلك", "دخل الشهر " + money2(T.inc) + " والمصروف " + money2(T.exp) + " — الفرق " + money2(T.exp - T.inc) + " بياكل من رصيدك.", "tDown");

  // 3. daily allowance
  const al = allowance(mk);
  if (al && !ck.past && !ck.future && al.left > 0) {
    if (al.over) push("crit", "خرجت برة الخطة", "عديت الميزانية بـ " + money2(-al.rem) + ". أي صرف جديد الشهر ده بياخد من الادخار.", "alert");
    else push("info", "المسموح النهاردة", "فاضلك " + money2(al.rem) + " على " + al.left + " يوم، يعني حوالي " + money2(al.perDay) + " في اليوم.", "clock");
  }

  // 4. biggest category
  const ent = Object.entries(sc).sort((a, b) => b[1] - a[1]);
  if (ent.length && T.exp > 0) {
    const c = catById(ent[0][0]), share = ent[0][1] / T.exp * 100;
    push("info", "أكتر بند بياكل فلوسك: " + c.name, Math.round(share) + "% من مصاريف الشهر (" + money2(ent[0][1]) + ").", "pie");
  }

  // 5. vs last month
  const prev = totalsOf(mkShift(mk, -1));
  if (prev.exp > 0 && T.exp > 0) {

      else push("good", "مصاريفك قلّت عن الشهر اللي فات", "وفرت " + money2(prev.exp - T.exp) + " (" + Math.round(-d) + "%)" + comp + ".", "tDown");
    }
  }

  // 6. savings rate
  if (T.inc > 0) {
    const rate = (T.inc - T.exp) / T.inc * 100;
    if (rate >= (+state.settings.savePct || 15)) push("good", "نسبة ادخارك كويسة", "وفرت " + Math.round(rate) + "% من دخل الشهر — " + money2(T.inc - T.exp) + ".", "check");
    else if (rate > 0 && ck.past) push("warn", "ادخارك أقل من هدفك", "وفرت " + Math.round(rate) + "% والهدف " + (+state.settings.savePct || 15) + "%. الفرق " + money2((+state.settings.savePct || 15) / 100 * T.inc - (T.inc - T.exp)) + ".", "flag");
  }

  // 7. goals pace
  state.goals.forEach(g => {
    const st = goalStatus(g);
    if (st.done) { push("good", "خلصت هدف « " + g.name + " »", "وصلت لـ " + money2(g.target) + ". مبروك — تقدر تقفل الهدف أو تزوّد المبلغ.", "check"); return; }
    if (st.late) { push("crit", "معاد « " + g.name + " » عدى", "لسه ناقص " + money2(st.left) + ". غيّر المعاد أو زوّد المبلغ الشهري.", "alert"); return; }
    if (st.stuck) { push("warn", "هدف « " + g.name + " » من غير خطة", "ناقصك " + money2(st.left) + " ومفيش مبلغ شهري محدد. افتح الهدف وحدّد مبلغ أو نسبة من دخلك.", "flag"); return; }
    if (st.gap < -1) push("warn", "متأخر في « " + g.name + " »", "المفروض يكون معاك " + money2(st.expected) + " دلوقتي، ومعاك " + money2(g.saved || 0) + ". حوّش " + money2(st.need) + " الشهر ده عشان تلحق.", "flag");
  });

  // goals vs capacity
  const gNeed = goalsMonthlyTotal();
  if (gNeed > 0) {
    const cap = savingCapacity();
    if (gNeed > cap * 1.02)
      push("crit", "أهدافك أكبر من قدرتك على الادخار", "أهدافك محتاجة " + money2(gNeed) + " كل شهر، وقدرتك الحالية " + money2(cap) + ". قلّل حدود الصرف بـ " + money2(gNeed - cap) + " أو مدّ معاد هدف منهم.", "scale");
    else if (cap > 0)
      push("good", "أهدافك في حدود قدرتك", "محتاج " + money2(gNeed) + " شهرياً وقدرتك " + money2(cap) + " — فاضل " + money2(cap - gNeed) + ".", "check");
  }

  // 8. biggest single expense
  const mt = txOfMonth(mk).filter(t => t.type === "expense").sort((a, b) => b.amount - a.amount)[0];
  if (mt && T.exp > 0 && mt.amount / T.exp > 0.2)
    push("info", "حركة واحدة أخدت جزء كبير", money2(mt.amount) + " في " + catById(mt.catId).name + (mt.note ? " (" + mt.note + ")" : "") + " — " + Math.round(mt.amount / T.exp * 100) + "% من صرف الشهر.", "info");

  // 9. logging gap
  if (!ck.past && !ck.future && state.txs.length) {
    const last = state.txs.map(t => t.date).sort().pop();
    const gap = daysBetween(last, todayISO());
    if (gap >= 3) push("warn", "بقالك " + gap + " يوم ما سجلتش حاجة", "الأرقام بتبقى مظبوطة لما تسجل أول بأول. سجّل اللي فات دلوقتي.", "clock");
  }

  // 10. backup reminder
  const bAge = backupAgeDays();
  if (state.txs.length >= 8 && (bAge === null || bAge >= 21))
    push("warn", bAge === null ? "ما خدتش نسخة احتياطية لسه" : "آخر نسخة احتياطية من " + bAge + " يوم",
      "عندك " + nf(state.txs.length) + " حركة مسجلة. نزّل نسخة من « الإعدادات ← نسخة احتياطية » عشان لو حصل حاجة للجهاز ترجّعها في ثانية.", "down");

  // 11. no budgets yet
  if (bt === 0) push("info", "ما فيش حدود صرف لسه", "حدّد حد شهري لكل بند من تبويب « الحدود » عشان التطبيق يقدر ينبهك قبل ما تتعدى.", "tabShield");

  const order = { crit: 0, warn: 1, good: 2, info: 3 };
  return out.sort((a, b) => order[a.lv] - order[b.lv]);
}

      }).join("") + "</div>";

  if (state.goals.length) {
    h += '<h2 class="sec">أهداف الادخار<span class="hint"><button class="btn ghost" style="padding:2px 6px;font-size:12px" data-act="goGoals">التفاصيل</button></span></h2><div class="card">' +
      state.goals.slice(0, 2).map(g => {
        const st = goalStatus(g);
        return '<div class="goal"><div class="ringwrap">' + ring(st.pct, st.done ? "var(--good)" : st.gap < 0 ? "var(--warn)" : "var(--accent)") +
          '<div style="flex:1"><div class="gname">' + esc(g.name) + '</div><div class="gmeta">' + nf(g.saved || 0) + " من " + nf(g.target) + " " + esc(state.settings.currency) +
          (g.deadline ? " · فاضل " + st.mLeft + " شهر" : "") + "</div></div>" +
          '<button class="btn" data-act="contrib" data-id="' + g.id + '">' + ico("plus") + "ضيف</button></div></div>";

}
function txRow(t) {

function viewTx() {
  const mk = state.ui.mk, f = state.ui.filter, q = (state.ui.q || "").trim();

  let h = '<div class="card pad" style="margin-bottom:12px">' +

    ['all:الكل', 'expense:مصروف', 'income:دخل'].map(s => { const [v, n] = s.split(":"); return '<button data-act="filter" data-v="' + v + '" aria-pressed="' + (f === v) + '">' + n + "</button>"; }).join("") + "</div>" +

    '<div class="ftrow" style="padding-top:10px"><span>' + list.length + ' حركة</span><span>دخل ' + nf(T.inc) + " · مصروف " + nf(T.exp) + "</span></div></div>";

  const groups = {};
  list.forEach(t => { (groups[t.date] = groups[t.date] || []).push(t); });
  h += '<div class="card list">';
  Object.keys(groups).sort((a, b) => b.localeCompare(a)).forEach(d => {

  });
  return h + "</div>";
}

function viewBudget() {

    '<div style="margin-inline-start:auto;text-align:left">' + (inc > 0 ? (bt > inc ? pill("crit", "أعلى من دخلك") : bt > 0 ? pill("good", "يسيب " + nf(inc - bt) + " للادخار") : pill("info", "ما فيش حدود")) : pill("info", "حدّد دخلك في الإعدادات")) + "</div></div>";
  if (bt > 0) h += '<div class="bar" style="margin-top:12px"><i class="' + progClass(T.exp / bt * 100) + '" style="width:' + clamp(T.exp / bt * 100, 0, 100) + '%"></i></div>' +
    '<div class="ftrow" style="padding-top:8px"><span>اتصرف ' + nf(T.exp) + "</span><span>فاضل " + nf(Math.max(0, bt - T.exp)) + "</span></div>";
  h += '<div class="btnrow" style="margin-top:13px"><button class="btn" data-act="suggest">' + ico("spark") + 'اقترح حدود من دخلي</button><button class="btn" data-act="newCat">' + ico("plus") + "بند جديد</button></div></div>";

  h += '<h2 class="sec">الحدود لكل بند<span class="hint">دوس على بند عشان تعدّله</span></h2><div class="card">';
  const rows = state.categories.map(c => ({ c: c, sp: sc[c.id] || 0 })).sort((a, b) => {
    const pa = a.c.limit > 0 ? a.sp / a.c.limit : -1, pb = b.c.limit > 0 ? b.sp / b.c.limit : -1;
    return pb - pa || b.sp - a.sp;
  });
  h += rows.map(({ c, sp }) => {
    const lim = +c.limit || 0, p = lim > 0 ? sp / lim * 100 : 0;
    const pr = !ck.past && ck.day > 2 ? sp / ck.day * ck.dim : null;
    let badge = "";
    if (lim <= 0) badge = pill("info", "ما فيش حد");
    else if (sp > lim) badge = pill("crit", "زيادة " + nf(sp - lim));
    else if (p >= 80) badge = pill("warn", "قربت تخلص");
    else if (pr && pr > lim * 1.05) badge = pill("warn", "المعدل عالي");
    else badge = pill("good", "تمام");
    return '<button class="bud" style="display:block;width:100%;text-align:right;background:transparent;border-inline:0;border-top:0;cursor:pointer" data-act="editCat" data-id="' + c.id + '">' +
      '<div class="hd">' + catDot(c, 34) + '<span class="nm">' + esc(c.name) + "</span>" + badge +
      '<span class="rt"><b>' + nf(sp) + "</b><small>" + (lim > 0 ? "الحد " + nf(lim) : "من غير حد") + "</small></span></div>" +
      (lim > 0 ? '<div class="bar thin"><i class="' + progClass(p) + '" style="width:' + clamp(p, 0, 100) + '%"></i></div>' +
        '<div class="ft"><span>' + (sp > lim ? "عديت الحد" : "فاضل " + nf(lim - sp)) + "</span><span>" + (pr ? "متوقع " + nf(pr) : "") + "</span></div>"
        : '<div class="ft" style="margin-top:0"><span>اتصرف ' + nf(sp) + " الشهر ده — حدّد حد عشان نقدر ننبهك</span></div>") + "</button>";
  }).join("") + "</div>";
  return h;
}

const MODE_LABEL = { deadline: "لحد معاد", monthly: "مبلغ شهري", percent: "نسبة من الدخل" };

  }

    const st = goalStatus(g), cur = esc(state.settings.currency);
    const col = st.done ? "var(--good)" : st.late || st.stuck ? "var(--crit)" : st.gap < -1 ? "var(--warn)" : "var(--accent)";
    let plan;
    if (st.done) plan = "وصلت للهدف بالكامل. تقدر تصرفه أو تزوّد المبلغ المستهدف.";

    else if (st.mode === "deadline") plan = "عشان توصل لـ <b>" + nf(g.target) + "</b> قبل " + fmtDate(g.deadline) + "، حوّش <b>" + nf(st.need) + " " + cur + "</b> كل شهر — حوالي <b>" + nf(st.perDay) + "</b> في اليوم على مدار " + nf(st.dLeft) + " يوم.";

    else plan = "بتحوّش <b>" + nf(st.need) + " " + cur + "</b> كل شهر. ناقصك " + nf(st.left) + "، يعني هتوصل خلال <b>" + nf(st.eta) + "</b> شهر — حوالي " + fmtDate(st.etaDate) + ".";
    const badge = st.done ? pill("good", "خلص") : st.late ? pill("crit", "المعاد عدى") : st.stuck ? pill("crit", "محتاج خطة") : st.gap < -1 ? pill("warn", "متأخر " + nf(-st.gap)) : pill("good", "في السكة");

  }).join("") + "</div>";
  return h;
}
function fmtDate(iso) { if (!iso) return ""; const d = new Date(iso + "T00:00:00"); return d.getDate() + " " + AR_MONTHS[d.getMonth()] + " " + d.getFullYear(); }

function viewStats() {
  const mk = state.ui.mk, T = totalsOf(mk), ck = monthClock(mk), list = txOfMonth(mk).filter(t => t.type === "expense");
  let h = "";
  const d = donutChart(mk);
  h += '<h2 class="sec">المصاريف على البنود<span class="hint">' + mkLabel(mk) + "</span></h2>";
  h += '<div class="card pad">' + (d ? d.html : '<div class="empty"><div class="eic">' + ico("pie") + "</div><h4>ما فيش مصاريف الشهر ده</h4><p>سجّل حركات عشان نقدر نطلعلك التوزيع.</p></div>") + "</div>";

  h += '<h2 class="sec">الدخل والمصروف<span class="hint">آخر 6 شهور</span></h2><div class="card pad">' + barsChart(mk) + "</div>";

  // stats grid
  const dayTot = {}; list.forEach(t => dayTot[t.date] = (dayTot[t.date] || 0) + t.amount);

    '<div class="tile"><div class="k">' + ico("tUp") + '<span>أعلى يوم</span></div><div class="v">' + (topDay ? nf(topDay[1]) : "0") + "</div></div></div>";

  // movers
  const cur = spendByCat(mk), prv = spendByCat(mkShift(mk, -1));

  if (mov.length) {
    h += '<h2 class="sec">مقارنة بـ ' + mkLabel(mkShift(mk, -1)) + "</h2><div class=\"card list\">" + mov.map(m =>
      '<div class="item" style="cursor:default">' + catDot(m.c, 34) +

      '<span class="amt" style="color:' + (m.d > 0 ? "var(--down)" : "var(--up)") + '"><span class="num">' + (m.d > 0 ? "+" : "−") + nf(Math.abs(m.d)) + "</span></span></div>").join("") + "</div>";

function debounce(fn, ms) { let t; return function () { const a = arguments, c = this; clearTimeout(t); t = setTimeout(() => fn.apply(c, a), ms); }; }

/* ---------- chart interactions ---------- */
function wireCharts() {
  const db = el("donutBox");
  if (db) {
    const d = donutChart(state.ui.mk), tt = el("donutTT");
    db.querySelectorAll(".seg").forEach(s => {
      const move = (ev) => {
        const p = d.parts[+s.dataset.i], r = db.getBoundingClientRect();
        tt.innerHTML = '<div class="tk">' + esc(p.c.name) + '</div><div class="tv"><span class="num">' + nf(p.v) + "</span> " + esc(state.settings.currency) + " · " + Math.round(p.v / d.total * 100) + "%</div>";
        tt.style.left = (ev.clientX - r.left) + "px"; tt.style.top = (ev.clientY - r.top) + "px"; tt.classList.add("on");
      };
      s.addEventListener("pointermove", move); s.addEventListener("pointerenter", move);
      s.addEventListener("pointerleave", () => tt.classList.remove("on"));
    });
  }
  const bb = el("barsBox");
  if (bb) {
    const tt = el("barsTT");
    bb.querySelectorAll("path[data-mk]").forEach(p => {
      const move = (ev) => {
        const r = bb.getBoundingClientRect();
        tt.innerHTML = '<div class="tk">' + mkLabel(p.dataset.mk) + " · " + (p.dataset.k === "inc" ? "دخل" : "مصروف") + '</div><div class="tv"><span class="num">' + nf(+p.dataset.v) + "</span> " + esc(state.settings.currency) + "</div>";
        tt.style.left = (ev.clientX - r.left) + "px"; tt.style.top = (ev.clientY - r.top) + "px"; tt.classList.add("on");
      };
      p.addEventListener("pointermove", move); p.addEventListener("pointerenter", move);
      p.addEventListener("pointerleave", () => tt.classList.remove("on"));
    });
  }
}

function addTxFromSheet(id) {
  const sh = el("sheet"), amt = parseFloat(el("txAmt").value);
  if (!(amt > 0)) return toast("اكتب مبلغ أكبر من صفر");
  const cat = sh.dataset.cat; if (!cat) return toast("اختار البند");
  const date = el("txDate").value || todayISO();
  const note = el("txNote").value.trim().slice(0, 120);
  const type = sh.dataset.type;
  if (id) {
    const t = state.txs.find(x => x.id === id); if (!t) return;
    const oldMK = mkOf(t.date);
    Object.assign(t, { type: type, amount: amt, catId: cat, date: date, note: note });
    save("m:" + oldMK); if (mkOf(date) !== oldMK) save("m:" + mkOf(date));
    toast("اتعدلت");
  } else {
    state.txs.push({ id: uid("t"), type: type, amount: amt, catId: cat, date: date, note: note, at: Date.now() });
    save("m:" + mkOf(date));
    toast(type === "income" ? "اتسجل دخل " + money2(amt) : "اتسجل مصروف " + money2(amt));
  }
  state.ui.mk = mkOf(date) <= thisMK() ? mkOf(date) : state.ui.mk;
  closeSheet(); render();
}
function suggestLimits() {
  const inc = +state.settings.income || 0;
  if (!(inc > 0)) return toast("حدّد دخلك الشهري في الإعدادات الأول");
  const avail = inc * (1 - (+state.settings.savePct || 0) / 100);
  const totalPct = state.categories.reduce((s, c) => s + (+c.pct || 0), 0) || 100;
  state.categories.forEach(c => { c.limit = Math.round(avail * (+c.pct || 0) / totalPct / 5) * 5; });
  save("categories"); render();
  toast("اتحطت حدود مقترحة — عدّلها زي ما تحب");
}
/* ---------- backup & restore ---------- */
async function saveFile(name, text, mime) {
  mime = mime || "application/json";
  let dl = null;
  try { dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null; } catch (_) { }
  if (dl) {
    try { await dl.save({ filename: name, data: text }); return "saved"; }
    catch (e) { if (e && e.code === "cancelled") return "cancelled"; }
  }
  if (!window.claude) {
    const ext = "." + name.split(".").pop();
    if (window.showSaveFilePicker) {
      try {
        const h = await window.showSaveFilePicker({ suggestedName: name, types: [{ description: ext === ".csv" ? "ملف CSV" : "ملف نسخة احتياطية", accept: { [mime]: [ext] } }] });
        const w = await h.createWritable();
        await w.write(new Blob([text], { type: mime + ";charset=utf-8" }));
        await w.close();
        return "saved";
      } catch (e) { if (e && (e.name === "AbortError" || e.name === "NotAllowedError")) return "cancelled"; }
    }
    try {
      const url = URL.createObjectURL(new Blob([text], { type: mime + ";charset=utf-8" }));
      const a = document.createElement("a");
      a.href = url; a.download = name; document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
      return "downloads";
    } catch (_) { }
  }
  try { await navigator.clipboard.writeText(text); return "clipboard"; }
  catch (_) { return "failed"; }
}
function backupPayload() {
  return { app: "masroufy", v: 1, savedAt: new Date().toISOString(), settings: state.settings, categories: state.categories, txs: state.txs, goals: state.goals };
}
function cleanName(n, ext) {
  n = (n || "").trim().replace(/[\\/:*?"<>|]/g, "-").slice(0, 60) || "masroufy-backup-" + todayISO();
  if (!n.toLowerCase().endsWith(ext)) n += ext;
  return n;
}
async function exportBackup() {
  const inp = el("bkName");
  const name = cleanName(inp ? inp.value : "", ".json");
  const r = await saveFile(name, JSON.stringify(backupPayload(), null, 2), "application/json");
  if (r === "cancelled") return;
  if (r === "saved" || r === "downloads") {
    state.settings.lastBackup = new Date().toISOString();
    save("settings");
    toast(r === "downloads" ? "نزّلنا « " + name + " » في مجلد التنزيلات" : "اتحفظت النسخة في « " + name + " »");
    if (el("bkStatus")) el("bkStatus").innerHTML = backupStatusHTML();
  } else if (r === "clipboard") toast("مقدرناش نحفظ ملف — نسخنا البيانات للحافظة، الزقها في ملف نصي");
  else toast("مقدرناش نحفظ الملف على الجهاز ده");
}
async function exportCSV() {
  const rows = [["التاريخ", "النوع", "البند", "المبلغ", "ملاحظة"]];
  state.txs.slice().sort((a, b) => a.date.localeCompare(b.date)).forEach(t =>
    rows.push([t.date, t.type === "income" ? "دخل" : "مصروف", catById(t.catId).name, t.amount, (t.note || "").replace(/[",\n]/g, " ")]));
  const csv = "﻿" + rows.map(r => r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(",")).join("\n");
  const r = await saveFile(cleanName("masroufy-" + todayISO(), ".csv"), csv, "text/csv");
  if (r === "saved" || r === "downloads") toast("اتحفظ ملف الحركات");
  else if (r === "clipboard") toast("نسخنا الجدول للحافظة");
  else if (r !== "cancelled") toast("مقدرناش نحفظ الملف");
}
function backupAgeDays() {
  if (!state.settings.lastBackup) return null;
  const d = new Date(state.settings.lastBackup);
  if (isNaN(d)) return null;
  return Math.floor((Date.now() - d.getTime()) / 86400000);
}
function backupStatusHTML() {
  const a = backupAgeDays();
  if (a === null) return pill("warn", "لسه ما خدتش نسخة احتياطية");
  if (a === 0) return pill("good", "آخر نسخة: النهاردة");
  if (a === 1) return pill("good", "آخر نسخة: إمبارح");
  if (a <= 30) return pill(a <= 14 ? "good" : "warn", "آخر نسخة: من " + a + " يوم");
  return pill("crit", "آخر نسخة: من " + a + " يوم");
}

let pendingRestore = null;
function importFile(e) {
  const f = e.target.files && e.target.files[0];
  e.target.value = "";
  if (!f) return;
  const r = new FileReader();
  r.onerror = () => toast("مقدرناش نقرا الملف");
  r.onload = () => {
    let d;
    try { d = JSON.parse(r.result); } catch (_) { return toast("الملف ده مش ملف نسخة احتياطية سليم"); }
    if (!d || !Array.isArray(d.txs)) return toast("الملف مش فيه حركات — اتأكد إنه الملف الصح");
    pendingRestore = d;
    sheetRestore(f.name);
  };
  r.readAsText(f);
}
function sheetRestore(fileName) {
  const d = pendingRestore; if (!d) return;
  const dates = d.txs.map(t => t.date).filter(Boolean).sort();
  const known = new Set(state.txs.map(t => t.id));
  const fresh = d.txs.filter(t => !known.has(t.id)).length;
  const savedAt = d.savedAt ? new Date(d.savedAt) : null;
  const row = (k, v) => '<div class="ftrow" style="padding:6px 0;border-bottom:1px solid var(--line)"><span>' + k + '</span><span style="color:var(--ink);font-weight:600">' + v + "</span></div>";
  openSheet("استرجاع نسخة احتياطية",
    '<p class="sub" style="margin:0 0 12px">الملف: ' + esc(fileName || "نسخة احتياطية") + "</p>" +
    '<div class="card pad" style="margin-bottom:14px">' +
    row("عدد الحركات في الملف", nf(d.txs.length)) +
    row("الفترة", dates.length ? fmtDate(dates[0]) + " ← " + fmtDate(dates[dates.length - 1]) : "—") +
    row("البنود", nf((d.categories || []).length)) +
    row("أهداف الادخار", nf((d.goals || []).length)) +
    (savedAt && !isNaN(savedAt) ? row("تاريخ النسخة", fmtDate(savedAt.toISOString().slice(0, 10))) : "") +
    '<div class="ftrow" style="padding:6px 0"><span>حركات جديدة مش عندك</span><span style="color:var(--ink);font-weight:600">' + nf(fresh) + "</span></div></div>" +
    '<div class="btnrow" style="flex-direction:column;align-items:stretch">' +
    '<button class="btn pri block" data-act="restoreMerge">' + ico("plus") + "ادمج مع بياناتي (أضف الناقص بس)</button>" +
    '<button class="btn danger block" data-act="restoreReplace">' + ico("up") + "استبدل كل بياناتي بالنسخة دي</button>" +
    '<button class="btn ghost block" data-act="closeSheet">إلغاء</button></div>' +
    '<p class="sub" style="margin:12px 0 0">« ادمج » بيضيف الحركات اللي مش موجودة عندك وما بيمسحش حاجة. « استبدل » بيمسح كل اللي عندك دلوقتي ويحط اللي في الملف مكانه.</p>');
}
function applyRestore(mode) {
  const d = pendingRestore; if (!d) return;
  const touched = new Set(state.txs.map(t => mkOf(t.date)));
  if (mode === "replace") {
    if (d.settings) { Object.assign(state.settings, d.settings); state.settings.onboarded = true; }
    if (Array.isArray(d.categories) && d.categories.length) state.categories = d.categories;
    state.txs = d.txs.slice();
    state.goals = Array.isArray(d.goals) ? d.goals.slice() : [];
  } else {
    const known = new Set(state.txs.map(t => t.id));
    d.txs.forEach(t => { if (t && t.id && !known.has(t.id)) { state.txs.push(t); known.add(t.id); } });
    (d.categories || []).forEach(c => { if (c && c.id && !state.categories.some(x => x.id === c.id)) state.categories.push(c); });
    (d.goals || []).forEach(g => { if (g && g.id && !state.goals.some(x => x.id === g.id)) state.goals.push(g); });
  }
  state.txs.forEach(t => touched.add(mkOf(t.date)));
  save("settings", "categories", "goals");
  touched.forEach(mk => save("m:" + mk));
  const n = d.txs.length;
  pendingRestore = null;
  closeSheet(); render();
  toast(mode === "replace" ? "رجّعنا النسخة — " + nf(state.txs.length) + " حركة" : "دمجنا النسخة — إجمالي " + nf(state.txs.length) + " حركة");
}

/* ---------- AI analysis ---------- */
let sampleNS = undefined;
async function mountAI() {
  const slot = el("aiSlot"); if (!slot) return;
  if (sampleNS === undefined) { try { sampleNS = window.claude && window.claude.use ? await window.claude.use("sample") : null; } catch (_) { sampleNS = null; } }
  if (!sampleNS) return;
  if (!el("aiSlot")) return;
  el("aiSlot").innerHTML = '<h2 class="sec">تحليل مكتوب لمصاريفك</h2><div class="card pad">' +
    '<p class="sub" style="margin:0 0 12px">اضغط عشان نقرا أرقام آخر شهرين ونكتبلك تحليل وخطوات عملية تقلل بيها الصرف.</p>' +
    '<button class="btn pri block" data-act="runAI">' + ico("bolt") + 'حلّل مصاريفي</button><div id="aiOut" class="aiout" style="margin-top:12px"></div></div>';
}
async function runAI() {
  const out = el("aiOut"), btn = document.querySelector('[data-act="runAI"]');
  if (!sampleNS || !out) return;
  btn.disabled = true; out.textContent = "بنقرا الأرقام…";
  const mk = state.ui.mk, prev = mkShift(mk, -1);
  const pack = (m) => {
    const T = totalsOf(m), sc = spendByCat(m);
    return { month: m, income: Math.round(T.inc), expense: Math.round(T.exp), byCategory: Object.entries(sc).map(([id, v]) => ({ name: catById(id).name, amount: Math.round(v), limit: +catById(id).limit || 0 })) };
  };
  const data = {
    currency: state.settings.currency, monthlyIncome: +state.settings.income || 0, savingTargetPct: +state.settings.savePct || 0,
    balance: Math.round(balanceNow().total), current: pack(mk), previous: pack(prev),
    goals: state.goals.map(g => { const s = goalStatus(g); return { name: g.name, target: g.target, saved: g.saved || 0, deadline: g.deadline || null, neededMonthly: Math.round(s.need || 0) }; })
  };
  const prompt = "إنت مستشار مالي شخصي بتكلم مصري بالعامية المصرية البسيطة. جاتلك بيانات مصاريف شخص بالجنيه. " +
    "اكتب تحليل قصير ومفيد في 4 أقسام بعناوين واضحة: (1) الخلاصة في سطرين، (2) أكتر 3 حاجات بتاكل فلوسه وليه، " +
    "(3) 4 خطوات عملية بأرقام محددة يقدر ينفذها الشهر الجاي عشان يوفر، (4) هل هيقدر يوصل لأهدافه ولا لأ وإيه المطلوب. " +
    "استخدم أرقام من البيانات نفسها، ما تخترعش أرقام، وما تكتبش مقدمات أو اعتذارات. البيانات:\n" + JSON.stringify(data);
  try {
    const res = await sampleNS(prompt, { modelTier: "default", onText: ({ text }) => { out.textContent = text; } });
    out.textContent = res.text;
  } catch (e) {
    out.textContent = "";
    toast(e && e.code === "rate_limited" ? "استنى شوية وجرب تاني" : "مقدرناش نعمل التحليل دلوقتي");
  } finally { if (btn) btn.disabled = false; }
}

/* ---------- events ---------- */
document.addEventListener("click", (ev) => {
  const b = ev.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act, v = b.dataset.v, id = b.dataset.id;
  const sh = el("sheet");
  switch (a) {
    case "tab": state.ui.tab = v; render(); window.scrollTo({ top: 0, behavior: "smooth" }); break;
    case "mprev": state.ui.mk = mkShift(state.ui.mk, -1); render(); break;
    case "mnext": if (state.ui.mk < thisMK()) { state.ui.mk = mkShift(state.ui.mk, 1); render(); } break;
    case "goTx": state.ui.tab = "tx"; render(); break;
    case "goGoals": state.ui.tab = "goals"; render(); break;
    case "filter": state.ui.filter = v; render(); break;
    case "allTips": sheetTips(); break;
    case "closeSheet": closeSheet(); break;
    case "newTx": sheetTx(); break;
    case "editTx": sheetTx(id); break;
    case "txType": sh.dataset.type = v; sh.querySelectorAll('[data-act="txType"]').forEach(x => x.setAttribute("aria-pressed", String(x.dataset.v === v))); paintCats(); break;
    case "pickCat": sh.dataset.cat = v; paintCats(); break;
    case "quick": {
      const inp = el("txAmt"); if (!inp) break;
      if (v === "مسح") inp.value = ""; else inp.value = String((parseFloat(inp.value) || 0) + parseFloat(v));
      break;
    }
    case "saveTx": addTxFromSheet(id); break;
    case "delTx": {
      const t = state.txs.find(x => x.id === id); if (!t) break;
      state.txs = state.txs.filter(x => x.id !== id); save("m:" + mkOf(t.date)); closeSheet(); render(); toast("اتمسحت");
      break;
    }
    case "newCat": sheetCat(); break;
    case "editCat": sheetCat(id); break;
    case "pickIcon": sh.dataset.icon = v; repaintPick("cIcons", v); break;
    case "pickColor": sh.dataset.color = v; repaintPick("cColors", v); break;
    case "saveCat": {
      const name = el("cName").value.trim(); if (!name) return toast("اكتب اسم البند");
      const lim = Math.max(0, parseFloat(el("cLimit").value) || 0);
      if (id) { const c = state.categories.find(x => x.id === id); Object.assign(c, { name: name, limit: lim, icon: sh.dataset.icon, color: sh.dataset.color }); }
      else state.categories.push({ id: uid("c"), name: name, limit: lim, icon: sh.dataset.icon, color: sh.dataset.color, pct: 0 });
      save("categories"); closeSheet(); render(); toast("اتحفظ");
      break;
    }
    case "delCat": {
      const used = state.txs.some(t => t.catId === id);
      if (used) return toast("البند ده عليه حركات — امسح حركاته الأول أو سيبه بحد 0");
      state.categories = state.categories.filter(c => c.id !== id); save("categories"); closeSheet(); render(); toast("اتمسح");
      break;
    }
    case "suggest": suggestLimits(); break;
    case "newGoal": sheetGoal(); break;
    case "editGoal": sheetGoal(id); break;
    case "goalMode": sh.dataset.gmode = v; paintGoalMode(); break;
    case "pctQuick": { const n = el("gPct"); if (n) { n.value = v; goalPreview(); } break; }
    case "saveGoal": {
      const name = el("gName").value.trim(); if (!name) return toast("اكتب اسم الهدف");
      const target = parseFloat(el("gTarget").value) || 0; if (!(target > 0)) return toast("اكتب المبلغ المستهدف");
      const saved = Math.max(0, parseFloat(el("gSaved").value) || 0);
      const m = sh.dataset.gmode || "monthly";
      const deadline = m === "deadline" ? (el("gDate").value || "") : "";
      const monthly = m === "monthly" ? Math.max(0, parseFloat(el("gMonthly").value) || 0) : 0;
      const pct = m === "percent" ? clamp(parseFloat(el("gPct").value) || 0, 0, 90) : 0;
      if (m === "deadline" && !deadline) return toast("اختار المعاد اللي عايز توصل فيه");
      if (m === "monthly" && !(monthly > 0)) return toast("اكتب المبلغ اللي هتحوّشه كل شهر");
      if (m === "percent" && !(pct > 0)) return toast("اختار نسبة من دخلك");
      if (m === "percent" && !(+state.settings.income > 0)) return toast("حدّد دخلك الشهري في الإعدادات الأول");
      const data = { name: name, target: target, saved: saved, mode: m, deadline: deadline, monthly: monthly, pct: pct };
      if (id) { const g = state.goals.find(x => x.id === id); Object.assign(g, data); }
      else state.goals.push(Object.assign({ id: uid("g"), startedAt: todayISO() }, data));
      save("goals"); closeSheet(); render(); toast("الخطة اتحفظت");
      break;
    }
    case "delGoal": state.goals = state.goals.filter(g => g.id !== id); save("goals"); closeSheet(); render(); toast("اتمسح الهدف"); break;
    case "editBalance": sheetBalance(); break;
    case "saveBalance": {
      const want = parseFloat(el("balAmt").value);
      if (isNaN(want)) return toast("اكتب رقم");
      const net = state.txs.reduce((s, t) => s + (t.type === "income" ? t.amount : -t.amount), 0);
      state.settings.startBalance = want - net;
      save("settings"); closeSheet(); render(); toast("الرصيد بقى " + money2(want));
      break;
    }
    case "contrib": sheetContrib(id); break;
    case "doContrib": {
      const amt = parseFloat(el("ctAmt").value); if (!(amt > 0)) return toast("اكتب مبلغ");
      const g = state.goals.find(x => x.id === id); if (!g) break;
      g.saved = (g.saved || 0) + amt; g.log = (g.log || []).concat([{ d: todayISO(), a: amt }]).slice(-60);
      save("goals"); closeSheet(); render(); toast("ضفنا " + money2(amt) + " لـ " + g.name);
      break;
    }
    case "obDone": {
      const s = state.settings;
      s.name = el("obName").value.trim().slice(0, 30);
      s.currency = (el("obCur").value.trim() || "ج.م").slice(0, 8);
      s.startBalance = parseFloat(el("obBal").value) || 0;
      s.income = parseFloat(el("obInc").value) || 0;
      s.savePct = clamp(parseFloat(el("obSave").value) || 0, 0, 90);
      s.onboarded = true;
      if (s.income > 0) {
        const avail = s.income * (1 - s.savePct / 100);
        state.categories.forEach(c => { c.limit = Math.round(avail * (c.pct || 0) / 100 / 5) * 5; });
      }
      save("settings", "categories"); render();
      toast(s.name ? "أهلاً " + s.name + " — يلا نسجل أول حركة" : "يلا نسجل أول حركة");
      break;
    }
    case "saveSettings": {
      const s = state.settings;
      s.name = el("stName").value.trim().slice(0, 30);
      s.currency = (el("stCur").value.trim() || "ج.م").slice(0, 8);
      s.startBalance = parseFloat(el("stBal").value) || 0;
      s.income = parseFloat(el("stInc").value) || 0;
      s.savePct = clamp(parseFloat(el("stSave").value) || 0, 0, 90);
      save("settings"); closeSheet(); render(); toast("الإعدادات اتحفظت");
      break;
    }
    case "exportBackup": exportBackup(); break;
    case "exportCSV": exportCSV(); break;
    case "importPick": el("impFile").click(); break;
    case "restoreMerge": applyRestore("merge"); break;
    case "restoreReplace": applyRestore("replace"); break;
    case "resetAsk":
      openSheet("متأكد إنك عايز تمسح كل حاجة؟",
        '<p class="sub" style="margin:0 0 14px">هيتمسح كل الحركات والبنود والأهداف والإعدادات. الخطوة دي مش بترجع.</p>' +
        '<button class="btn block" data-act="exportBackup" style="margin-bottom:10px">' + ico("down") + "نزّل نسخة احتياطية الأول</button>" +
        '<div class="btnrow"><button class="btn" style="flex:1" data-act="closeSheet">لأ، رجعني</button><button class="btn danger" data-act="resetDo">' + ico("trash") + "امسح كل حاجة</button></div>");
      break;
    case "resetDo": doReset(); break;
    case "runAI": runAI(); break;
  }
});
el("fab").addEventListener("click", () => sheetTx());
el("btnSettings").addEventListener("click", sheetSettings);
el("backdrop").addEventListener("click", (e) => { if (e.target === el("backdrop")) closeSheet(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !el("backdrop").hidden) closeSheet(); });
window.addEventListener("scroll", () => { el("topbar").classList.toggle("scrolled", window.scrollY > 6); }, { passive: true });

async function doReset() {
  const mks = [...new Set(state.txs.map(t => mkOf(t.date)))];
  state.settings = { name: "", currency: "ج.م", startBalance: 0, income: 0, savePct: 15, onboarded: false };
  state.categories = JSON.parse(JSON.stringify(DEFAULT_CATS));
  state.txs = []; state.goals = []; state.ui = { tab: "home", mk: thisMK(), filter: "all", q: "" };
  writeLocal();
  if (Store.db) {
    try {
      await Store.db.doc("app/settings").set(state.settings);
      await Store.db.doc("app/categories").set({ list: state.categories });
      await Store.db.doc("app/goals").set({ list: [] });
      for (const mk of mks) await Store.db.doc("months/" + mk).delete();
    } catch (_) { }
  }
  closeSheet(); render(); toast("اتمسح كل حاجة");
}
