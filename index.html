<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="مصروفي — تطبيق عربي لتتبع المصاريف وحدود الصرف والسلف وخطط الادخار. مقفول برمز وبصمة، وبيشتغل من غير نت.">
<meta name="theme-color" content="#0D6470">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="مصروفي">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-family:system-ui,sans-serif;font-size:14px;background:#fcfcfb}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>مصروفي</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#EDF0F1; --surface:#FFFFFF; --surface-2:#F4F6F7; --surface-3:#E6EBEC;
  --ink:#141C1F; --ink-2:#3C4A4F; --muted:#5F7075; --line:#DBE2E4;
  --accent:#0D6470; --accent-ink:#FFFFFF; --accent-soft:#D8EBEE; --accent-line:#9CC9CF;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --up:#12772F; --down:#BE3B32;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948; --s9:#6b7a80;
  --track:#E3E9EA;
  --shadow-sm:0 1px 2px rgba(16,34,40,.07);
  --shadow:0 1px 2px rgba(16,34,40,.06), 0 10px 26px -16px rgba(16,34,40,.35);
  --r:16px; --r-sm:10px;
  --ff-display:"Readex Pro","IBM Plex Sans Arabic","Segoe UI",system-ui,sans-serif;
  --ff-body:"IBM Plex Sans Arabic","Readex Pro","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1315; --surface:#161D20; --surface-2:#1C2428; --surface-3:#232D32;
    --ink:#E8EEF0; --ink-2:#C2CED2; --muted:#8FA1A7; --line:#27343A;
    --accent:#43B3C0; --accent-ink:#06282D; --accent-soft:#12343A; --accent-line:#2A5A61;
    --up:#4ECB77; --down:#F08A82;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
    --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767; --s9:#7d8d94;
    --track:#242F34;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 28px -18px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1315; --surface:#161D20; --surface-2:#1C2428; --surface-3:#232D32;
  --ink:#E8EEF0; --ink-2:#C2CED2; --muted:#8FA1A7; --line:#27343A;
  --accent:#43B3C0; --accent-ink:#06282D; --accent-soft:#12343A; --accent-line:#2A5A61;
  --up:#4ECB77; --down:#F08A82;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767; --s9:#7d8d94;
  --track:#242F34;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 28px -18px rgba(0,0,0,.9);
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--ff-body); font-size:15px; line-height:1.55;
  direction:rtl; text-align:right;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
button,input,select,textarea{font-family:inherit; font-size:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:6px}
.num{font-variant-numeric:tabular-nums; direction:ltr; unicode-bidi:isolate; display:inline-block}

/* ---------- shell ---------- */
.shell{max-width:620px; margin-inline:auto; min-height:100%; padding-inline:16px;
  padding-block:0 108px; background:var(--bg)}
.topbar{position:sticky; top:env(safe-area-inset-top,0px); z-index:30;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:saturate(1.4) blur(10px);
  display:flex; align-items:center; gap:10px; padding-block:12px 10px;
  border-bottom:1px solid transparent; margin-inline:-16px; padding-inline:16px}
.topbar.scrolled{border-bottom-color:var(--line)}
.brand{font-family:var(--ff-display); font-weight:700; font-size:19px; letter-spacing:-.01em; margin-inline-end:auto; display:flex; align-items:center; gap:8px}
.brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent)}
.iconbtn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);
  background:var(--surface); display:grid; place-items:center; color:var(--ink-2); box-shadow:var(--shadow-sm)}
.iconbtn:hover{border-color:var(--accent-line); color:var(--accent)}
.iconbtn svg{width:19px;height:19px}

.monthbar{display:flex; align-items:center; justify-content:space-between; gap:8px;
  background:var(--surface); border:1px solid var(--line); border-radius:12px;
  padding:6px 8px; margin-block:2px 14px; box-shadow:var(--shadow-sm)}
.monthbar b{font-family:var(--ff-display); font-weight:600; font-size:15px}
.monthbar .mnav{width:32px;height:32px;border-radius:9px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center}
.monthbar .mnav:hover{background:var(--surface-3); color:var(--ink)}
.monthbar .mnav svg{width:17px;height:17px}
.monthbar .mnav[disabled]{opacity:.3; pointer-events:none}

/* ---------- typography ---------- */
h2.sec{font-family:var(--ff-display); font-size:15px; font-weight:600; margin:22px 0 10px;
  display:flex; align-items:center; gap:8px; text-wrap:balance}
h2.sec .hint{font-family:var(--ff-body); font-size:12px; font-weight:400; color:var(--muted); margin-inline-start:auto}
.lbl{font-size:11.5px; font-weight:600; letter-spacing:.06em; color:var(--muted); text-transform:uppercase}
.sub{color:var(--muted); font-size:13px}

/* ---------- cards ---------- */
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow-sm)}
.pad{padding:16px}
.stack{display:flex; flex-direction:column; gap:12px}
.row{display:flex; align-items:center; gap:10px}

/* hero */
.hero{background:linear-gradient(160deg, var(--accent) 0%, color-mix(in srgb,var(--accent) 72%, #000) 100%);
  color:#fff; border-radius:20px; padding:18px 18px 16px; box-shadow:var(--shadow); position:relative; overflow:hidden;
  display:block; width:100%; text-align:right; border:0; font:inherit}
.hero .cap{display:flex; align-items:center; gap:6px}
.hero .heroedit{width:14px;height:14px;opacity:.75;flex:none}
.hero:hover .heroedit{opacity:1}
.hero::after{content:""; position:absolute; inset:auto -40px -70px auto; width:190px; height:190px;
  border-radius:50%; background:rgba(255,255,255,.07)}
.hero .cap{font-size:12.5px; opacity:.88}
.hero .big{font-family:var(--ff-display); font-weight:700; font-size:34px; line-height:1.15; margin-top:4px; letter-spacing:-.02em}
.hero .cur{font-size:16px; opacity:.8; font-weight:500}
.hero .split{display:flex; gap:10px; margin-top:16px; position:relative; z-index:1}
.hero .qt{flex:1; background:rgba(255,255,255,.12); border-radius:12px; padding:9px 11px}
.hero .qt .k{font-size:11.5px; opacity:.85}
.hero .qt .v{font-family:var(--ff-display); font-weight:600; font-size:16px; margin-top:1px}

/* tiles */
.tiles{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; align-items:stretch}
.tile{background:var(--surface); border:1px solid var(--line); border-radius:13px; padding:11px 12px;
  display:flex; flex-direction:column; justify-content:space-between; min-height:74px}
.tile .k{font-size:11.5px; color:var(--muted); display:flex; align-items:center; gap:5px; line-height:1.35}
.tile .k span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.tile .v{font-family:var(--ff-display); font-weight:600; font-size:17px; margin-top:6px; letter-spacing:-.01em}
.tile .v.up{color:var(--up)} .tile .v.down{color:var(--down)}
.tile .k svg{width:13px;height:13px;flex:none}
.ftrow{display:flex; justify-content:space-between; gap:10px; font-size:12px; color:var(--muted)}
@media(max-width:380px){ .tiles{grid-template-columns:repeat(2,1fr)} }

/* allowance strip */
.allow{display:flex; align-items:center; gap:12px; padding:13px 14px; border-radius:14px;
  background:var(--accent-soft); border:1px solid var(--accent-line); color:var(--ink)}
.allow .ic{width:38px;height:38px;border-radius:11px;background:var(--surface);display:grid;place-items:center;color:var(--accent);flex:none;border:1px solid var(--accent-line)}
.allow .ic svg{width:20px;height:20px}
.allow > span svg{width:100%;height:100%}
.allow{font:inherit}
.allow .v{font-family:var(--ff-display); font-weight:700; font-size:19px; line-height:1.2}
.allow .t{font-size:12px; color:var(--ink-2)}

/* progress */
.bar{display:block; height:8px; border-radius:99px; background:var(--track); overflow:hidden; position:relative}
.bar > i{display:block; height:100%; border-radius:99px; background:var(--accent); transition:width .35s ease}
.bar.thin{height:6px}
.bar > i.ok{background:var(--good)} .bar > i.warn{background:var(--warn)} .bar > i.over{background:var(--crit)}

/* list rows */
.list{display:flex; flex-direction:column}
.item{display:flex; align-items:center; gap:11px; padding:11px 14px; border-bottom:1px solid var(--line);
  background:transparent; border-top:0; border-inline:0; width:100%; text-align:right}
.item:last-child{border-bottom:0}
.item:hover{background:var(--surface-2)}
.ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none}
.ic svg{width:19px;height:19px}
.item .nm{font-weight:500; font-size:14.5px}
.item .mt{font-size:12px; color:var(--muted); margin-top:1px}
.item .amt{margin-inline-start:auto; font-family:var(--ff-display); font-weight:600; font-size:15px; white-space:nowrap}
.amt.up{color:var(--up)} .amt.down{color:var(--ink)}

.daygroup{padding:9px 14px; background:var(--surface-2); border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted); font-weight:500}
.daygroup .tot{margin-inline-start:auto; font-variant-numeric:tabular-nums}

/* budget rows */
.bud{padding:13px 14px; border-bottom:1px solid var(--line)}
.bud:last-child{border-bottom:0}
.bud .hd{display:flex; align-items:center; gap:10px; margin-bottom:9px}
.bud .nm{font-weight:500}
.bud .rt{margin-inline-start:auto; text-align:left; font-size:12.5px; color:var(--muted); line-height:1.3; flex:none}
.bud .rt b{font-family:var(--ff-display); font-size:15px; color:var(--ink); font-weight:600; display:block; font-variant-numeric:tabular-nums}
.bud .rt small{font-size:11.5px; white-space:nowrap; font-variant-numeric:tabular-nums}
.bud .nm{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.bud .ft{display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-top:7px; gap:8px}

/* pills */
.pill{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600;
  padding:3px 9px; border-radius:99px; border:1px solid transparent; white-space:nowrap}
.pill svg{width:13px;height:13px;flex:none}
.pill.good{background:color-mix(in srgb,var(--good) 14%, var(--surface)); color:var(--up); border-color:color-mix(in srgb,var(--good) 32%, transparent)}
.pill.warn{background:color-mix(in srgb,var(--warn) 20%, var(--surface)); color:color-mix(in srgb,var(--warn) 70%, var(--ink)); border-color:color-mix(in srgb,var(--warn) 45%, transparent)}
.pill.crit{background:color-mix(in srgb,var(--crit) 14%, var(--surface)); color:var(--down); border-color:color-mix(in srgb,var(--crit) 32%, transparent)}
.pill.flat{background:var(--surface-3); color:var(--muted); border-color:var(--line)}

/* insights */
.tip{display:flex; gap:11px; padding:12px 14px; border-bottom:1px solid var(--line)}
.tip:last-child{border-bottom:0}
.tip .bullet{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none}
.tip .bullet svg{width:16px;height:16px}
.tip h4{margin:0 0 2px; font-size:14px; font-weight:600; font-family:var(--ff-display)}
.tip p{margin:0; font-size:13px; color:var(--ink-2); line-height:1.5}

/* goals */
.goal{padding:14px; border-bottom:1px solid var(--line)}
.goal:last-child{border-bottom:0}
.ringwrap{display:flex; gap:14px; align-items:center}
.ring{width:66px;height:66px;flex:none}
.goal .gname{font-family:var(--ff-display); font-weight:600; font-size:15.5px}
.goal .gmeta{font-size:12.5px; color:var(--muted); margin-top:2px}
.plan{margin-top:11px; background:var(--surface-2); border:1px solid var(--line); border-radius:11px; padding:10px 12px; font-size:13px; line-height:1.6}
.plan b{font-family:var(--ff-display); color:var(--accent)}

/* buttons */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:7px;
  border-radius:12px; border:1px solid var(--line); background:var(--surface);
  padding:10px 15px; font-weight:600; font-size:14px; color:var(--ink); box-shadow:var(--shadow-sm)}
.btn:hover{border-color:var(--accent-line)}
.btn svg{width:17px;height:17px}
.btn.pri{background:var(--accent); color:var(--accent-ink); border-color:transparent}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent; box-shadow:none}
.btn.danger{color:var(--down); border-color:color-mix(in srgb,var(--crit) 35%, var(--line))}
.btn.block{width:100%}
.btn[disabled]{opacity:.5; pointer-events:none}
.btnrow{display:flex; gap:9px; flex-wrap:wrap}

/* forms */
.field{display:flex; flex-direction:column; gap:6px; margin-bottom:13px}
.field > label{font-size:12.5px; font-weight:600; color:var(--ink-2)}
.inp{width:100%; padding:11px 13px; border-radius:12px; border:1px solid var(--line);
  background:var(--surface-2); color:var(--ink); font-size:15px}
.inp:focus{outline:none; border-color:var(--accent); background:var(--surface)}
input.inp[type=number]{direction:ltr; text-align:right; font-variant-numeric:tabular-nums}
.inp.big{font-family:var(--ff-display); font-size:26px; font-weight:700; padding:14px; letter-spacing:-.01em}
.inp.big::placeholder{font-weight:600; opacity:.35}
input.inp[type=date]{direction:ltr; text-align:right}
textarea.inp{resize:vertical; min-height:62px}
.segs{display:flex; gap:6px; background:var(--surface-2); padding:4px; border-radius:13px; border:1px solid var(--line)}
.segs button{flex:1; border:0; background:transparent; padding:9px 4px; border-radius:10px; font-weight:600; font-size:13.5px; color:var(--muted); white-space:nowrap}
.segs button[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:var(--shadow-sm)}
.segs button[aria-pressed="true"][data-v="income"]{color:var(--up)}
.segs button[aria-pressed="true"][data-v="expense"]{color:var(--down)}
.chips{display:flex; flex-wrap:wrap; gap:7px}
.chip{display:inline-flex; align-items:center; gap:6px; padding:7px 11px; border-radius:11px;
  border:1px solid var(--line); background:var(--surface-2); font-size:13px; font-weight:500}
.chip svg{width:15px;height:15px}
.chip[aria-pressed="true"]{border-color:currentColor; background:var(--surface)}
.keypad{display:grid; grid-template-columns:repeat(4,1fr); gap:7px}
.keypad button{padding:8px 0; border-radius:10px; border:1px solid var(--line); background:var(--surface-2); font-size:13px; font-weight:600; color:var(--ink-2)}

/* tabbar + fab */
.dock{position:fixed; bottom:0; left:50%; transform:translateX(-50%);
  width:min(620px,100%); pointer-events:none; z-index:40}
.tabbar{pointer-events:auto; display:flex; gap:2px; margin:0 12px;
  background:color-mix(in srgb,var(--surface) 92%, transparent); backdrop-filter:blur(12px) saturate(1.5);
  border:1px solid var(--line); border-radius:18px; padding:6px;
  margin-bottom:calc(10px + env(safe-area-inset-bottom,0px)); box-shadow:var(--shadow)}
.tabbar button{flex:1; min-width:0; border:0; background:transparent; border-radius:12px;
  display:flex; flex-direction:column; align-items:center; gap:3px; padding:7px 1px 6px; color:var(--muted); font-size:9.5px; font-weight:600}
.tabbar button span{max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.tabbar button svg{width:19px;height:19px}
@media(min-width:420px){ .tabbar button{font-size:10.5px} .tabbar button svg{width:20px;height:20px} }
.tabbar button[aria-current="true"]{background:var(--accent-soft); color:var(--accent)}
.fab{pointer-events:auto; position:absolute; bottom:calc(76px + env(safe-area-inset-bottom,0px)); inset-inline-start:18px;
  width:54px; height:54px; border-radius:18px; border:0; background:var(--accent); color:var(--accent-ink);
  display:grid; place-items:center; box-shadow:0 8px 22px -8px color-mix(in srgb,var(--accent) 75%, transparent), var(--shadow)}
.fab svg{width:25px;height:25px}
.fab:hover{filter:brightness(1.08)}

/* sheet */
.backdrop{position:fixed; inset:0; z-index:50; background:rgba(8,18,21,.45); backdrop-filter:blur(2px);
  display:flex; align-items:flex-end; justify-content:center}
.sheet{width:min(620px,100%); max-height:92vh; overflow-y:auto; background:var(--surface);
  border-radius:22px 22px 0 0; border:1px solid var(--line); border-bottom:0;
  padding:0 16px calc(20px + env(safe-area-inset-bottom,0px));
  animation:rise .24s cubic-bezier(.2,.8,.3,1)}
@keyframes rise{from{transform:translateY(22px); opacity:.6} to{transform:none; opacity:1}}
@media(prefers-reduced-motion:reduce){ .sheet{animation:none} .bar > i{transition:none} }
.sheet .grip{width:40px;height:4px;border-radius:99px;background:var(--line);margin:9px auto 4px}
.sheet .shd{position:sticky; top:0; background:var(--surface); z-index:2; display:flex; align-items:center; gap:10px; padding:6px 0 12px}
.sheet .shd h3{margin:0; font-family:var(--ff-display); font-size:17px; font-weight:600}
.sheet .shd .x{margin-inline-start:auto}

/* charts */
.chartbox{position:relative}
.chartbox svg{width:100%; height:auto; display:block; overflow:visible}
#donutBox{max-width:250px; margin-inline:auto}
.legend{display:flex; flex-wrap:wrap; gap:8px 14px; margin-top:12px}
.legend .li{display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--ink-2)}
.legend .sw{width:10px;height:10px;border-radius:3px;flex:none}
.legend .va{color:var(--muted); font-variant-numeric:tabular-nums}
.tt{position:absolute; pointer-events:none; z-index:5; background:var(--surface); border:1px solid var(--line);
  border-radius:10px; box-shadow:var(--shadow); padding:7px 10px; font-size:12.5px; white-space:nowrap;
  transform:translate(-50%,-115%); opacity:0; transition:opacity .12s}
.tt.on{opacity:1}
.tt .tk{color:var(--muted); font-size:11px}
.tt .tv{font-family:var(--ff-display); font-weight:600}

/* table view */
.tbl{width:100%; border-collapse:collapse; font-size:13px}
.tbl th,.tbl td{padding:7px 9px; border-bottom:1px solid var(--line); text-align:right}
.tbl th{color:var(--muted); font-weight:600; font-size:11.5px}
.tbl td.n{font-variant-numeric:tabular-nums}
.tblwrap{overflow-x:auto}
details.more{margin-top:10px}
details.more summary{cursor:pointer; font-size:12.5px; color:var(--accent); font-weight:600; list-style:none}
details.more summary::-webkit-details-marker{display:none}

/* empty */
.empty{text-align:center; padding:30px 18px; color:var(--muted)}
.empty .eic{width:52px;height:52px;border-radius:16px;background:var(--surface-2);display:grid;place-items:center;margin:0 auto 12px;color:var(--accent)}
.empty .eic svg{width:24px;height:24px}
.empty h4{margin:0 0 5px; font-family:var(--ff-display); font-size:15px; color:var(--ink); font-weight:600}
.empty p{margin:0 auto; max-width:34ch; font-size:13px; line-height:1.6}

/* onboarding */
.ob{padding:6px 0 10px}
.ob .obhead{text-align:center; padding:14px 0 18px}
.ob .obhead .mark{width:58px;height:58px;border-radius:19px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin:0 auto 12px}
.ob .obhead .mark svg{width:28px;height:28px}
.ob h1{font-family:var(--ff-display); font-size:23px; margin:0 0 6px; font-weight:700; letter-spacing:-.02em}
.ob .obhead p{margin:0 auto; max-width:38ch; color:var(--muted); font-size:13.5px; line-height:1.6}

/* toast */
.toast{position:fixed; top:calc(12px + env(safe-area-inset-top,0px)); left:50%; transform:translateX(-50%) translateY(-12px);
  background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:12px; font-size:13.5px; font-weight:500;
  z-index:70; opacity:0; transition:.2s; pointer-events:none; box-shadow:var(--shadow); max-width:calc(100vw - 32px); text-align:center}
.toast.on{opacity:1; transform:translateX(-50%)}

/* split bill */
.splitbox{margin-top:11px; background:var(--surface-2); border:1px solid var(--line); border-radius:12px; padding:12px}
.splitequal{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--ink-2); flex-wrap:wrap; margin-bottom:11px}
.splitequal .inp{width:62px; padding:8px; text-align:center; background:var(--surface)}
.splitequal .btn{padding:8px 13px; font-size:13px}
.splitrow{display:flex; gap:7px; align-items:center; margin-bottom:7px}
.splitrow .sp-name{flex:1.4; min-width:0; background:var(--surface); padding:9px 11px}
.splitrow .sp-amt{flex:1; min-width:0; background:var(--surface); padding:9px 11px}
.splitrow .sp-del{width:34px;height:34px;flex:none;border-radius:9px}
.splitrow .sp-del svg{width:15px;height:15px}
.spsum{margin-top:11px; padding-top:11px; border-top:1px solid var(--line); font-size:13px; line-height:1.7}
.spsum b{font-family:var(--ff-display)}
.spsum .warnline{color:var(--down); font-weight:600}

/* wallets */
.wrail{display:flex; gap:9px; overflow-x:auto; padding-bottom:3px; scrollbar-width:none}
.wrail::-webkit-scrollbar{display:none}
.wcard{flex:0 0 auto; min-width:128px; background:var(--surface); border:1px solid var(--line); border-radius:14px;
  padding:11px 12px; text-align:right; box-shadow:var(--shadow-sm)}
.wcard:hover{border-color:var(--accent-line)}
.wcard .wt{display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--muted)}
.wcard .wt i{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;flex:none}
.wcard .wt i svg{width:14px;height:14px}
.wcard .wv{font-family:var(--ff-display); font-weight:600; font-size:17px; margin-top:7px; letter-spacing:-.01em}
.wcard .wv.neg{color:var(--down)}
.wcard .wtag{display:block;margin-top:4px;font-size:10.5px;color:var(--s4);font-weight:600}
.wcard.add{min-width:0; display:grid; place-items:center; color:var(--accent); border-style:dashed; padding-inline:16px}
.wcard.add svg{width:20px;height:20px}

/* wallet filter bar */
.wfbar{margin-bottom:14px}
.wfbar .chips{gap:7px}
.wfbar .chip{background:var(--surface); box-shadow:var(--shadow-sm)}
.wfbar .chip[aria-pressed="true"]{border-color:currentColor; background:var(--surface)}

/* period switcher */
.psegs{display:flex; gap:5px; background:var(--surface); padding:4px; border-radius:13px; border:1px solid var(--line); margin-bottom:12px; box-shadow:var(--shadow-sm)}
.psegs button{flex:1; border:0; background:transparent; padding:8px 4px; border-radius:10px; font-weight:600; font-size:13.5px; color:var(--muted); white-space:nowrap}
.psegs button[aria-current="true"]{background:var(--accent-soft); color:var(--accent)}

/* today strip */
.today{display:flex; align-items:center; gap:12px; padding:13px 14px; border-radius:14px;
  background:var(--surface); border:1px solid var(--line); box-shadow:var(--shadow-sm)}
.today .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--surface-2);color:var(--accent)}
.today .ic svg{width:21px;height:21px}
.today .v{font-family:var(--ff-display); font-weight:700; font-size:20px; line-height:1.2}
.today .t{font-size:12px; color:var(--muted); margin-top:1px}

/* lock screen */
.lockwrap{min-height:100%; display:flex; flex-direction:column; justify-content:center; align-items:center;
  padding:40px 4px; text-align:center; gap:4px}
.lockwrap .lmark{width:62px;height:62px;border-radius:20px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin-bottom:14px;border:1px solid var(--accent-line)}
.lockwrap .lmark svg{width:28px;height:28px}
.lockwrap h1{font-family:var(--ff-display); font-size:21px; margin:0 0 5px; font-weight:700}
.lockwrap p{margin:0 0 20px; color:var(--muted); font-size:13.5px; max-width:32ch}
.dots{display:flex; gap:11px; margin-bottom:22px; min-height:15px}
.dots i{width:13px;height:13px;border-radius:50%;background:var(--track);border:1px solid var(--line);transition:.15s}
.dots i.on{background:var(--accent); border-color:var(--accent); transform:scale(1.08)}
.dots.bad i{background:var(--crit); border-color:var(--crit); animation:shake .32s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media(prefers-reduced-motion:reduce){ .dots.bad i{animation:none} }
.numpad{display:grid; grid-template-columns:repeat(3,1fr); gap:11px; width:min(280px,86vw); direction:ltr}
.numpad button{aspect-ratio:1.5; border-radius:15px; border:1px solid var(--line); background:var(--surface);
  font-family:var(--ff-display); font-size:21px; font-weight:600; color:var(--ink); box-shadow:var(--shadow-sm)}
.numpad button:active{background:var(--surface-3)}
.numpad button.alt{font-size:14px; color:var(--muted); background:transparent; box-shadow:none; border-color:transparent}
.numpad button.alt svg{width:22px;height:22px}
.numpad button.bio{color:var(--accent)}
.lockerr{color:var(--down); font-size:13px; min-height:19px; margin-top:16px; font-weight:500}

/* ===== نظام العرض الجديد: دفتر مش كروت ===== */
.led{background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:18px 18px 16px;
  box-shadow:var(--shadow); margin-bottom:18px}
.led .cap{display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--muted)}
.led .cap svg{width:13px;height:13px;opacity:.6}
.led .tot{font-family:var(--ff-display); font-weight:700; font-size:36px; line-height:1.1;
  letter-spacing:-.03em; margin-top:3px; display:flex; align-items:baseline; gap:7px}
.led .tot .cu{font-size:15px; font-weight:500; color:var(--muted); letter-spacing:0}
.stack{display:flex; gap:3px; height:10px; margin:15px 0 11px; border-radius:99px; overflow:hidden}
.stack i{display:block; border-radius:3px; min-width:4px; transition:width .35s ease}
.stack.empty{background:var(--track)}
.ledkeys{display:flex; flex-wrap:wrap; gap:6px 14px}
.ledkeys button{display:flex; align-items:center; gap:6px; background:transparent; border:0; padding:2px 0;
  font-size:12.5px; color:var(--muted); font-family:inherit}
.ledkeys i{width:8px;height:8px;border-radius:2.5px;flex:none}
.ledkeys b{color:var(--ink); font-family:var(--ff-display); font-weight:600; font-variant-numeric:tabular-nums}
.ledsplit{display:flex; gap:0; margin-top:15px; padding-top:14px; border-top:1px solid var(--line)}
.ledsplit > button{flex:1; background:transparent; border:0; padding:0; text-align:right; font-family:inherit}
.ledsplit > button + button{border-inline-start:1px solid var(--line); padding-inline-start:14px}
.ledsplit > button:first-child{padding-inline-end:14px}
.ledsplit .k{font-size:12px; color:var(--muted); display:flex; align-items:center; gap:5px}
.ledsplit .k svg{width:12px;height:12px}
.ledsplit .v{font-family:var(--ff-display); font-weight:600; font-size:19px; margin-top:3px; letter-spacing:-.01em}

/* مجموعة: عنوان عادي + جسم */
.grp{margin-bottom:18px}
.grp > .gh{display:flex; align-items:baseline; gap:9px; margin:0 2px 9px}
.grp > .gh h3{margin:0; font-family:var(--ff-display); font-size:15.5px; font-weight:600; letter-spacing:-.01em}
.grp > .gh .sub2{font-size:12.5px; color:var(--muted); font-variant-numeric:tabular-nums}
.grp > .gh .act{margin-inline-start:auto}
.grp > .gh .act button{background:transparent; border:0; color:var(--accent); font-weight:600; font-size:12.5px;
  font-family:inherit; padding:2px 4px; display:flex; align-items:center; gap:3px}
.grp > .gh .act svg{width:13px;height:13px}
.panel{background:var(--surface); border:1px solid var(--line); border-radius:16px; overflow:hidden}
.panel.pad2{padding:15px}

/* صف في قايمة */
.r{display:flex; align-items:center; gap:11px; width:100%; padding:12px 14px; background:transparent;
  border:0; border-bottom:1px solid var(--line); text-align:right; color:var(--ink); font-family:inherit; position:relative}
.r:last-child{border-bottom:0}
button.r:hover{background:var(--surface-2)}
.r .ri{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.r .ri svg{width:17px;height:17px}
.r .rt{flex:1; min-width:0}
.r .rn{font-size:14.5px; font-weight:500; display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.r .rm{font-size:12px; color:var(--muted); display:block; margin-top:1px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.r .rv{font-family:var(--ff-display); font-weight:600; font-size:15px; white-space:nowrap; font-variant-numeric:tabular-nums; text-align:left}
.r .rv small{display:block; font-size:11.5px; font-weight:400; color:var(--muted); margin-top:1px}
.r .rc{color:var(--muted); flex:none; display:flex}
.r .rc svg{width:15px;height:15px}
.r.up .rv{color:var(--up)} .r.down .rv{color:var(--ink)}

/* صف مرتّب بشريط خلفه */
.rank{position:relative; overflow:hidden}
.rank .fill{position:absolute; inset-block:0; inset-inline-start:0; opacity:.13; pointer-events:none; transition:width .35s ease}
.rank > *{position:relative}

/* عدّاد اليوم */
.meter{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:15px; margin-bottom:18px}
.meter .top{display:flex; align-items:flex-end; gap:10px; margin-bottom:12px}
.meter .big{font-family:var(--ff-display); font-weight:700; font-size:27px; line-height:1; letter-spacing:-.02em}
.meter .of{font-size:13px; color:var(--muted); padding-bottom:2px}
.meter .st{margin-inline-start:auto}
.meter .track{height:9px; border-radius:99px; background:var(--track); overflow:hidden; position:relative}
.meter .track i{display:block; height:100%; border-radius:99px; transition:width .4s ease}
.meter .foot{display:flex; justify-content:space-between; gap:10px; font-size:12px; color:var(--muted); margin-top:9px}
.meter .foot b{color:var(--ink); font-family:var(--ff-display); font-variant-numeric:tabular-nums}

/* شريط تنقّل الفترة */
.perio{display:flex; align-items:center; gap:8px; margin-bottom:14px}
.perio .seg{display:flex; gap:3px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:3px; flex:none}
.perio .seg button{border:0; background:transparent; padding:7px 13px; border-radius:9px; font-weight:600;
  font-size:13px; color:var(--muted); font-family:inherit}
.perio .seg button[aria-current="true"]{background:var(--accent); color:var(--accent-ink)}
.perio .nav{flex:1; display:flex; align-items:center; justify-content:space-between; gap:6px;
  background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:4px 6px; min-width:0}
.perio .nav b{font-family:var(--ff-display); font-weight:600; font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.perio .nav button{width:28px;height:28px;flex:none;border:0;background:transparent;color:var(--muted);border-radius:8px;display:grid;place-items:center}
.perio .nav button:hover{background:var(--surface-3);color:var(--ink)}
.perio .nav button svg{width:15px;height:15px}
.perio .nav button[disabled]{opacity:.25;pointer-events:none}

/* نتيجة كبيرة */
.bigstat{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:18px}
.bigstat .lab{font-size:12.5px; color:var(--muted)}
.bigstat .num2{font-family:var(--ff-display); font-weight:700; font-size:32px; letter-spacing:-.03em;
  margin-top:3px; display:flex; align-items:baseline; gap:7px}
.bigstat .num2 .cu{font-size:14px; font-weight:500; color:var(--muted)}
.bigstat .meta{display:flex; flex-wrap:wrap; gap:7px 16px; margin-top:12px; padding-top:12px; border-top:1px solid var(--line);
  font-size:12.5px; color:var(--muted)}
.bigstat .meta b{color:var(--ink); font-family:var(--ff-display); font-variant-numeric:tabular-nums}

.crumb{display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--muted); margin-bottom:11px}
.crumb svg{width:12px;height:12px}
.crumb b{color:var(--ink)}
.budrow{border-bottom:1px solid var(--line)}
.budrow:last-child{border-bottom:0}
.budrow > .r{border-bottom:0 !important}

/* install banner */
.instbar{display:flex; align-items:center; gap:11px; padding:11px 13px; border-radius:14px;
  background:var(--accent-soft); border:1px solid var(--accent-line); color:var(--ink); margin-bottom:16px}
.instbar .ic{width:32px;height:32px;border-radius:10px;background:var(--surface);color:var(--accent);display:grid;place-items:center;flex:none}
.instbar .ic svg{width:17px;height:17px}
.instbar .x{width:28px;height:28px;flex:none;border:0;border-radius:8px;background:transparent;
  color:var(--muted);display:grid;place-items:center}
.instbar .x:hover{background:var(--surface)}
.instbar .x svg{width:14px;height:14px}

/* update banner */
.updbar{position:fixed; left:50%; transform:translateX(-50%);
  bottom:calc(146px + env(safe-area-inset-bottom,0px)); width:min(596px,calc(100vw - 24px));
  z-index:45; background:var(--accent); color:var(--accent-ink); border-radius:15px;
  padding:12px 14px; box-shadow:0 10px 30px -12px rgba(0,0,0,.5), var(--shadow);
  display:flex; align-items:center; gap:11px}
.updbar .ui{width:34px;height:34px;border-radius:11px;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:none}
.updbar .ui svg{width:18px;height:18px}
.updbar .ut{flex:1;min-width:0;font-size:13.5px;line-height:1.4}
.updbar .ut b{display:block;font-family:var(--ff-display);font-size:14.5px}
.updbar button{border:0;border-radius:10px;padding:9px 14px;font-weight:700;font-size:13.5px;
  background:var(--accent-ink); color:var(--accent); flex:none}
.updbar .later{background:rgba(255,255,255,.18);color:inherit;width:34px;height:34px;padding:0;
  display:grid;place-items:center;border-radius:10px}
.updbar .later svg{width:16px;height:16px}

/* settings rows */
.srow{display:flex; align-items:center; gap:11px; padding:13px 14px; border-bottom:1px solid var(--line);
  background:transparent; border-top:0; border-inline:0; width:100%; text-align:right; color:var(--ink)}
.srow:last-child{border-bottom:0}
.srow:hover{background:var(--surface-2)}
.srow .si{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--surface-2);color:var(--accent)}
.srow .si svg{width:17px;height:17px}
.srow .sn{font-weight:500; font-size:14.5px}
.srow .sd{font-size:12px; color:var(--muted); margin-top:1px}
.srow .sx{margin-inline-start:auto; color:var(--muted); display:flex; align-items:center; gap:7px}
.srow .sx svg{width:16px;height:16px}
.verbox{text-align:center; padding:18px 14px 4px; color:var(--muted); font-size:12.5px; line-height:1.9}
.verbox .vn{font-family:var(--ff-display); font-size:15px; color:var(--ink); font-weight:600}

.statusline{display:flex; align-items:center; gap:7px; font-size:11.5px; color:var(--muted); padding:14px 2px 0; justify-content:center}
.statusline .sd{width:7px;height:7px;border-radius:50%;background:var(--good)}
.statusline .sd.local{background:var(--warn)}
.aiout{white-space:pre-wrap; font-size:13.5px; line-height:1.75; color:var(--ink-2)}
hr.sep{border:0; border-top:1px solid var(--line); margin:16px 0}
</style>
</head>
<body>
<div class="shell" id="shell">
  <header class="topbar" id="topbar">
    <div class="brand"><span class="dot"></span><span id="brandName">مصروفي</span></div>
    <button class="iconbtn" id="btnAnalyzeTop" title="تنبيهات" hidden></button>
  </header>
  <main id="view"></main>
</div>

<div class="dock" id="dock" hidden>
  <button class="fab" id="fab" aria-label="إضافة حركة"></button>
  <nav class="tabbar" id="tabbar" role="tablist"></nav>
</div>

<div class="backdrop" id="backdrop" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
</div>

<div class="updbar" id="updBar" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ============================ مصروفي ============================ */
"use strict";
const APP_VERSION = "2.1.0";
const APP_BUILD = "2026-10-01";

/* ---------- helpers ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const el = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const clamp = (n, a, b) => Math.min(b, Math.max(a, n));
const uid = (p) => p + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const nf = (n, d) => new Intl.NumberFormat("en-US", { maximumFractionDigits: d == null ? ((Math.abs(n) < 1000 && Math.abs(n % 1) > 0.004) ? 2 : 0) : d, minimumFractionDigits: 0 }).format(n || 0);
const N = (n, d) => '<span class="num">' + nf(n, d) + "</span>";
const money = (n, d) => '<span class="num">' + nf(n, d) + "</span> " + esc(state.settings.currency);
const money2 = (n) => nf(n) + " " + state.settings.currency;

const people = (n) => n === 1 ? "حد واحد" : n === 2 ? "اتنين" : n <= 10 ? n + " ناس" : n + " شخص";
const AR_MONTHS = ["يناير", "فبراير", "مارس", "أبريل", "مايو", "يونيو", "يوليو", "أغسطس", "سبتمبر", "أكتوبر", "نوفمبر", "ديسمبر"];
const AR_MONTHS_SHORT = ["ينا", "فبر", "مار", "أبر", "مايو", "يون", "يول", "أغس", "سبت", "أكت", "نوف", "ديس"];
const AR_DAYS = ["الأحد", "الاثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة", "السبت"];

const todayISO = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const mkOf = (iso) => iso.slice(0, 7);
const thisMK = () => todayISO().slice(0, 7);
const mkLabel = (mk) => AR_MONTHS[+mk.slice(5, 7) - 1] + " " + mk.slice(0, 4);
const mkShift = (mk, n) => { let y = +mk.slice(0, 4), m = +mk.slice(5, 7) - 1 + n; y += Math.floor(m / 12); m = ((m % 12) + 12) % 12; return y + "-" + String(m + 1).padStart(2, "0"); };
const daysIn = (mk) => new Date(+mk.slice(0, 4), +mk.slice(5, 7), 0).getDate();
const dayLabel = (iso) => { const d = new Date(iso + "T00:00:00"); const t = todayISO(); if (iso === t) return "النهاردة"; if (iso === shiftDay(t, -1)) return "إمبارح"; return AR_DAYS[d.getDay()] + " " + d.getDate() + " " + AR_MONTHS[d.getMonth()]; };
function shiftDay(iso, n) { const d = new Date(iso + "T00:00:00"); d.setDate(d.getDate() + n); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function monthsBetween(aISO, bISO) { const a = new Date(aISO + "T00:00:00"), b = new Date(bISO + "T00:00:00"); return (b.getFullYear() - a.getFullYear()) * 12 + (b.getMonth() - a.getMonth()) + (b.getDate() >= a.getDate() ? 0 : -1); }
function daysBetween(aISO, bISO) { return Math.round((new Date(bISO + "T00:00:00") - new Date(aISO + "T00:00:00")) / 86400000); }

/* ---------- icons ---------- */

function migrate(d) {
  // رصيد ابتدائي قديم -> محفظة "معايا"

    const w = (d.wallets || state.wallets).find(x => x.id === "w_cash");
    if (w && !w.opening) w.opening = +d.settings.startBalance || 0;
    delete d.settings.startBalance;
  }
  (d.txs || []).forEach(t => { if (!t.walletId && t.type !== "transfer") t.walletId = "w_cash"; });

  // كل محفظة ليها نوع: صرف ولا ادخار
  if (Array.isArray(d.wallets)) d.wallets.forEach(w => { if (!w.kind) w.kind = "spend"; });

  // الادخار بقى محفظة حقيقية: ننقل أرصدة الأهداف القديمة جواها من غير ما الإجمالي يتغيّر
  if (Array.isArray(d.wallets) && d.wallets.length && !d.wallets.some(w => w.kind === "save")) {
    const goals = Array.isArray(d.goals) ? d.goals : [];
    const locked = goals.reduce((s, g) => s + (+g.saved || 0), 0);
    d.wallets.push({ id: "w_save", name: "الادخار", icon: "tabTarget", color: "s4", opening: locked, kind: "save" });
    if (locked > 0) {
      const spend = d.wallets.filter(w => w.kind === "spend");
      const pos = spend.filter(w => (+w.opening || 0) > 0);
      const pool = pos.length ? pos : spend.slice(0, 1);
      const sum = pool.reduce((s, w) => s + Math.max(0, +w.opening || 0), 0);
      let left = locked;
      pool.forEach((w, i) => {
        const share = i === pool.length - 1 ? left : (sum > 0 ? Math.round(locked * Math.max(0, +w.opening || 0) / sum * 100) / 100 : locked / pool.length);
        w.opening = Math.round(((+w.opening || 0) - share) * 100) / 100;
        left = Math.round((left - share) * 100) / 100;
      });
    }
    goals.forEach(g => { g.saved0 = +g.saved || 0; if (!Array.isArray(g.moves)) g.moves = []; });
  }
  (d.goals || []).forEach(g => { if (!Array.isArray(g.moves)) g.moves = []; if (g.saved0 == null) g.saved0 = 0; });
  return d;
}

  if (Array.isArray(d.categories) && d.categories.length) state.categories = d.categories;

  for (const c of state.categories) {
    const lim = +c.limit || 0; if (lim <= 0) continue;
    const sp = sc[c.id] || 0;
    if (sp > lim) overs.push({ c: c, by: sp - lim });

    else if (!ck.past && ck.day > 3) { const pr = sp / ck.day * ck.dim; if (pr > lim * 1.05) paceOvers.push({ c: c, pr: pr, lim: lim }); }
  }

    push("crit", "عديت حد " + o.c.name, "صرفت " + money2(sc[o.c.id]) + " والحد اللي حاططه " + money2(o.c.limit) + "، يعني زيادة " + money2(o.by) + ".", "alert"));
  nears.sort((a, b) => b.p - a.p).slice(0, 2).forEach(o =>
    push("warn", "قربت على حد " + o.c.name, "فاضلك " + money2(o.rem) + " بس في البند ده" + (ck.left > 0 ? " و" + ck.left + " يوم على آخر الشهر." : "."), "alert"));
  paceOvers.sort((a, b) => (b.pr - b.lim) - (a.pr - a.lim)).slice(0, 2).forEach(o =>
    push("warn", "معدل الصرف في " + o.c.name + " عالي", "بالمعدل ده هتقفل الشهر على " + money2(o.pr) + " والحد " + money2(o.lim) + ". قلّل حوالي " + money2((o.pr - o.lim) / Math.max(1, ck.left)) + " في اليوم.", "tUp"));

  // 2. spending more than income
  if (T.inc > 0 && T.exp > T.inc)
    push("crit", "بتصرف أكتر من دخلك", "دخل الشهر " + money2(T.inc) + " والمصروف " + money2(T.exp) + " — الفرق " + money2(T.exp - T.inc) + " بياكل من رصيدك.", "tDown");

  // 3. daily allowance
  const al = allowance(mk);
  if (al && !ck.past && !ck.future && al.left > 0) {
    if (al.over) push("crit", "خرجت برة الخطة", "عديت الميزانية بـ " + money2(-al.rem) + ". أي صرف جديد الشهر ده بياخد من الادخار.", "alert");
    else push("info", "المسموح النهاردة", "فاضلك " + money2(al.rem) + " على " + al.left + " يوم، يعني حوالي " + money2(al.perDay) + " في اليوم.", "clock");
  }

  // 4. biggest category
  const ent = Object.entries(sc).sort((a, b) => b[1] - a[1]);
  if (ent.length && T.exp > 0) {
    const c = catById(ent[0][0]), share = ent[0][1] / T.exp * 100;
    push("info", "أكتر بند بياكل فلوسك: " + c.name, Math.round(share) + "% من مصاريف الشهر (" + money2(ent[0][1]) + ").", "pie");
  }

  if (prev.exp > 0 && T.exp > 0) {

      if (d > 0) push("warn", "مصاريفك زادت عن الشهر اللي فات", "زيادة " + Math.round(d) + "% — " + money2(T.exp - prev.exp) + " فرق" + comp + ".", "tUp");
      else push("good", "مصاريفك قلّت عن الشهر اللي فات", "وفرت " + money2(prev.exp - T.exp) + " (" + Math.round(-d) + "%)" + comp + ".", "tDown");
    }
  }

  // 6. savings rate
  if (T.inc > 0) {
    const rate = (T.inc - T.exp) / T.inc * 100;
    if (rate >= (+state.settings.savePct || 15)) push("good", "نسبة ادخارك كويسة", "وفرت " + Math.round(rate) + "% من دخل الشهر — " + money2(T.inc - T.exp) + ".", "check");
    else if (rate > 0 && ck.past) push("warn", "ادخارك أقل من هدفك", "وفرت " + Math.round(rate) + "% والهدف " + (+state.settings.savePct || 15) + "%. الفرق " + money2((+state.settings.savePct || 15) / 100 * T.inc - (T.inc - T.exp)) + ".", "flag");
  }

  state.goals.forEach(g => {

    if (st.late) { push("crit", "معاد « " + g.name + " » عدى", "لسه ناقص " + money2(st.left) + ". غيّر المعاد أو زوّد المبلغ الشهري.", "alert"); return; }

    if (st.gap < -1) push("warn", "متأخر في « " + g.name + " »", "المفروض يكون معاك " + money2(st.expected) + " دلوقتي، ومعاك " + money2(goalSaved(g)) + ". حوّش " + money2(st.need) + " الشهر ده عشان تلحق.", "flag");
  });

  // goals vs capacity
  const gNeed = goalsMonthlyTotal();
  if (gNeed > 0) {
    const cap = savingCapacity();
    if (gNeed > cap * 1.02)
      push("crit", "أهدافك أكبر من قدرتك على الادخار", "أهدافك محتاجة " + money2(gNeed) + " كل شهر، وقدرتك الحالية " + money2(cap) + ". قلّل حدود الصرف بـ " + money2(gNeed - cap) + " أو مدّ معاد هدف منهم.", "scale");
    else if (cap > 0)
      push("good", "أهدافك في حدود قدرتك", "محتاج " + money2(gNeed) + " شهرياً وقدرتك " + money2(cap) + " — فاضل " + money2(cap - gNeed) + ".", "check");
  }

  // 8. biggest single expense
  const mt = txOfMonth(mk).filter(t => t.type === "expense").sort((a, b) => b.amount - a.amount)[0];
  if (mt && T.exp > 0 && mt.amount / T.exp > 0.2)
    push("info", "حركة واحدة أخدت جزء كبير", money2(mt.amount) + " في " + catById(mt.catId).name + (mt.note ? " (" + mt.note + ")" : "") + " — " + Math.round(mt.amount / T.exp * 100) + "% من صرف الشهر.", "info");

  // 9. logging gap
  if (!ck.past && !ck.future && state.txs.length) {
    const last = state.txs.map(t => t.date).sort().pop();
    const gap = daysBetween(last, todayISO());
    if (gap >= 3) push("warn", "بقالك " + gap + " يوم ما سجلتش حاجة", "الأرقام بتبقى مظبوطة لما تسجل أول بأول. سجّل اللي فات دلوقتي.", "clock");
  }

  // سلف قديمة
  const oldOut = state.debts.filter(d => d.dir === "out" && debtOpen(d) && daysBetween(d.date, todayISO()) >= 30)
    .sort((a, b) => a.date.localeCompare(b.date));
  if (oldOut.length) {
    const top = oldOut[0], age = daysBetween(top.date, todayISO());
    push("warn", "سلفة قديمة عند " + top.person, "بقالها " + age + " يوم و" + money2(debtLeft(top)) + " لسه ما رجعتش" +
      (oldOut.length > 1 ? " — وفي " + (oldOut.length - 1) + " سلفة تانية قديمة." : "."), "handOut");
  }
  const dT = debtTotals();
  if (dT.iOwe > 0) {
    const inc0 = +state.settings.income || 0;
    if (inc0 > 0 && dT.iOwe > inc0 * 0.3)
      push("crit", "الديون اللي عليك كبيرة", "عليك " + money2(dT.iOwe) + " — يعني " + Math.round(dT.iOwe / inc0 * 100) + "% من دخل شهر. حطها في حسابك قبل ما تخطط للصرف.", "handIn");
    else push("info", "عليك ديون للناس", "إجمالي " + money2(dT.iOwe) + " لـ " + people(dT.countIn) + ". الفلوس دي في محفظتك بس مش بتاعتك.", "handIn");
  }

    push("warn", bAge === null ? "ما خدتش نسخة احتياطية لسه" : "آخر نسخة احتياطية من " + bAge + " يوم",
      "عندك " + nf(state.txs.length) + " حركة مسجلة. نزّل نسخة من « الإعدادات ← نسخة احتياطية » عشان لو حصل حاجة للجهاز ترجّعها في ثانية.", "down");

}

  for (let i = 0; i <= 4; i++) {
    const v = max * i / 4, yy = y(v);
    g += '<line x1="' + pL + '" x2="' + (W - pR) + '" y1="' + yy.toFixed(1) + '" y2="' + yy.toFixed(1) + '" stroke="var(--line)" stroke-width="1"/>' +
      '<text x="' + (pL - 8) + '" y="' + (yy + 4).toFixed(1) + '" text-anchor="end" fill="var(--muted)" style="font:400 11px var(--ff-body);font-variant-numeric:tabular-nums" direction="ltr">' + nf(v, 0) + "</text>";
  }
  const gw = pw / 6, bw = Math.min(24, gw * 0.3);
  let bars = "";
  data.forEach((d, i) => {
    const cx = pL + gw * i + gw / 2;
    [["inc", d.t.inc, "s1", -1], ["exp", d.t.exp, "s2", 1]].forEach(([k, v, col, side]) => {
      const h = Math.max(v > 0 ? 2 : 0, (v / max) * ph);
      const x = cx + side * 2 - (side < 0 ? bw : 0);
      if (v > 0) bars += roundTop(x, y(v), bw, h, 4, "var(--" + col + ")", 'data-mk="' + d.mk + '" data-k="' + k + '" data-v="' + v + '"');
    });
    bars += '<text x="' + cx + '" y="' + (H - 10) + '" text-anchor="middle" fill="var(--muted)" style="font:500 11px var(--ff-body)">' + AR_MONTHS_SHORT[+d.mk.slice(5, 7) - 1] + "</text>";
  });
  const svg = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="الدخل والمصروف في آخر 6 شهور">' + g +
    '<line x1="' + pL + '" x2="' + (W - pR) + '" y1="' + (pT + ph) + '" y2="' + (pT + ph) + '" stroke="var(--muted)" stroke-width="1"/>' + bars + "</svg>";
  const legend = '<div class="legend"><span class="li"><i class="sw" style="background:var(--s1)"></i>دخل</span><span class="li"><i class="sw" style="background:var(--s2)"></i>مصروف</span></div>';
  const table = '<details class="more"><summary>عرض الأرقام كجدول</summary><div class="tblwrap"><table class="tbl"><thead><tr><th>الشهر</th><th>دخل</th><th>مصروف</th><th>الفرق</th></tr></thead><tbody>' +
    data.map(d => "<tr><td>" + mkLabel(d.mk) + '</td><td class="n">' + nf(d.t.inc) + '</td><td class="n">' + nf(d.t.exp) + '</td><td class="n">' + nf(d.t.net) + "</td></tr>").join("") +
    "</tbody></table></div></details>";
  return '<div class="chartbox" id="barsBox">' + svg + '<div class="tt" id="barsTT"></div></div>' + legend + table;
}
function roundTop(x, y, w, h, r, fill, attrs) {
  r = Math.min(r, w / 2, h);
  return '<path ' + (attrs || "") + ' d="M' + x + " " + (y + h) + "V" + (y + r) + "a" + r + " " + r + " 0 0 1 " + r + " " + -r + "h" + (w - 2 * r) + "a" + r + " " + r + " 0 0 1 " + r + " " + r + "V" + (y + h) + 'z" fill="' + fill + '" style="cursor:default"/>';
}
function sparkMonth(mk) {
  const ck = monthClock(mk); if (ck.future) return "";
  const days = ck.dim, byDay = new Array(days + 1).fill(0);
  txOfMonth(mk).forEach(t => { if (t.type === "expense") byDay[+t.date.slice(8, 10)] += t.amount; });
  const upto = ck.past ? days : ck.day;
  let acc = 0; const pts = [];
  for (let d = 1; d <= upto; d++) { acc += byDay[d]; pts.push([d, acc]); }
  if (!pts.length || acc <= 0) return "";
  const bt = budgetTotal() || (+state.settings.income || 0) * (1 - (+state.settings.savePct || 0) / 100);
  const max = niceMax(Math.max(acc, bt || 0));
  const W = 620, H = 132, pL = 10, pR = 10, pT = 12, pB = 22, pw = W - pL - pR, ph = H - pT - pB;
  const X = d => pL + (d - 1) / Math.max(1, days - 1) * pw, Y = v => pT + ph - (v / max) * ph;
  let d0 = "M" + X(pts[0][0]).toFixed(1) + " " + Y(pts[0][1]).toFixed(1);
  pts.slice(1).forEach(p => { d0 += "L" + X(p[0]).toFixed(1) + " " + Y(p[1]).toFixed(1); });
  const area = d0 + "L" + X(pts[pts.length - 1][0]).toFixed(1) + " " + (pT + ph) + "L" + X(pts[0][0]).toFixed(1) + " " + (pT + ph) + "Z";
  const last = pts[pts.length - 1];
  let bl = "";
  if (bt > 0) bl = '<line x1="' + pL + '" x2="' + (W - pR) + '" y1="' + Y(bt).toFixed(1) + '" y2="' + Y(bt).toFixed(1) + '" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="5 4"/>' +
    '<text x="' + pL + '" y="' + (Y(bt) - 7).toFixed(1) + '" text-anchor="start" fill="var(--muted)" style="font:500 11px var(--ff-body)" direction="ltr">' + nf(bt, 0) + "</text>";
  return '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="تراكم الصرف خلال الشهر">' +
    '<defs><linearGradient id="gspark" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="var(--accent)" stop-opacity=".28"/><stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>' +
    '<path d="' + area + '" fill="url(#gspark)"/>' +
    '<path d="' + d0 + '" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' + bl +
    '<circle cx="' + X(last[0]).toFixed(1) + '" cy="' + Y(last[1]).toFixed(1) + '" r="4.5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>' +
    '<text x="' + pL + '" y="' + (H - 6) + '" fill="var(--muted)" style="font:400 10.5px var(--ff-body)">يوم 1</text>' +
    '<text x="' + (W - pR) + '" y="' + (H - 6) + '" text-anchor="end" fill="var(--muted)" style="font:400 10.5px var(--ff-body)">يوم ' + days + "</text></svg>";
}
function ring(pct, color) {
  const R = 27, C = 2 * Math.PI * R, len = C * clamp(pct, 0, 100) / 100;
  return '<svg class="ring" viewBox="0 0 66 66" aria-hidden="true"><circle cx="33" cy="33" r="' + R + '" fill="none" stroke="var(--track)" stroke-width="6"/>' +
    '<circle cx="33" cy="33" r="' + R + '" fill="none" stroke="' + color + '" stroke-width="6" stroke-linecap="round" stroke-dasharray="' + len.toFixed(1) + " " + C.toFixed(1) + '" transform="rotate(-90 33 33)"/>' +
    '<text x="33" y="37" text-anchor="middle" fill="var(--ink)" style="font:600 14px var(--ff-display);font-variant-numeric:tabular-nums" direction="ltr">' + Math.round(pct) + "%</text></svg>";
}

function viewHome() {

    '<div class="ledsplit">' +
    '<button data-act="goStats"><span class="k">' + ico("coins") + "متاح للصرف</span><span class=\"v\">" + nf(B.free) + "</span></button>" +
    '<button data-act="goGoals"><span class="k">' + ico("tabTarget") + "في الادخار</span><span class=\"v\">" + nf(B.locked) + "</span></button>" +
    "</div></div>";

  // عدّاد اليوم
  const tSpent = spentOnDay(todayISO());
  const avgDay = ck.day > 0 ? T.exp / ck.day : 0;
  const cap = al && !al.over ? al.perDay : 0;
  const ratio = cap > 0 ? clamp(tSpent / cap * 100, 0, 100) : (avgDay > 0 ? clamp(tSpent / (avgDay * 2) * 100, 0, 100) : 0);
  const tone = cap > 0 ? (tSpent > cap ? "var(--crit)" : tSpent > cap * 0.8 ? "var(--warn)" : "var(--good)")
    : (avgDay > 0 && tSpent > avgDay * 1.25 ? "var(--warn)" : "var(--accent)");
  h += '<button class="meter" style="width:100%;text-align:right;font-family:inherit;color:inherit" data-act="goDay">' +
    '<div class="top"><span class="big">' + nf(tSpent) + "</span>" +

    '<span class="st">' + (cap > 0
      ? (tSpent > cap ? pill("crit", "عديت بـ " + nf(tSpent - cap, 0)) : pill("good", "فاضل " + nf(cap - tSpent, 0)))
      : (avgDay > 0 ? (tSpent > avgDay * 1.25 ? pill("warn", "فوق متوسطك") : pill("good", "في الطبيعي")) : "")) + "</span></div>" +

    { act: actBtn("goStats", "التحليل") });

  if (r.from > end) return 1;
  return clamp(daysBetween(r.from, end) + 1, 1, r.days);
}
/* تفاصيل بند: الفروع ثم الأيام ثم الحركات */
function sheetCatDetail(catId) {
  const wf = statWSet(), r = curRange(), c = catById(catId), cur = esc(state.settings.currency);
  const list = txOfCat(catId, r, wf).sort((a, b) => b.date.localeCompare(a.date) || (b.at || 0) - (a.at || 0));
  const total = list.reduce((s, t) => s + t.amount, 0);
  const days = Math.max(1, elapsedDays(r));
  const prev = prevRange(r);
  const pTotal = catTotal(catId, prev, wf);
  const diff = pTotal > 0 ? (total - pTotal) / pTotal * 100 : null;
  const lim = catLimit(c);
  const kids = childCats(catId);

  let h = (c.parent ? '<div class="crumb">' + ico("chevR") + "<b>" + esc(catById(c.parent).name) + "</b> › " + esc(c.name) + "</div>" : "") +

    '<div class="meta"><span>متوسط اليوم <b>' + nf(total / days, 0) + "</b></span>" +
    "<span><b>" + list.length + "</b> حركة</span>" +
    (pTotal > 0 ? "<span>" + prev.label + " <b>" + nf(pTotal) + "</b></span>" : "") +
    (diff !== null && Math.abs(diff) >= 1 ? "<span>" + (diff > 0 ? "أعلى" : "أقل") + " بـ <b>" + Math.round(Math.abs(diff)) + "%</b></span>" : "") +
    (lim > 0 && r.kind === "month" ? "<span>" + (total > lim ? "عديت الحد بـ <b>" + nf(total - lim) + "</b>" : "فاضل من الحد <b>" + nf(lim - total) + "</b>") + "</span>" : "") +
    "</div></div>";

  // الفروع

  }

  const gk = Object.keys(groups).sort((a, b) => b.localeCompare(a));
  const gmax = Math.max(1, ...Object.values(groups));

    h += grp(r.kind === "year" ? "على الشهور" : "على الأيام",
      '<div class="panel">' + gk.map(k => rowEl({
        act: r.kind === "year" ? "goMonth" : "pickDay", v: k,
        name: r.kind === "year" ? mkLabel(k) : dayLabel(k),
        value: nf(groups[k]),
        fill: (groups[k] / gmax * 100).toFixed(1), fillColor: "var(--" + c.color + ")", cls: "rank"
      })).join("") + "</div>", { sub: "دوس عشان تفتح الفترة" });
  }

  h += grp("الحركات", list.length
    ? '<div class="panel">' + list.map(t => txRow(t, { cat: !!kids.length })).join("") + "</div>"
    : '<div class="panel"><div class="empty"><p>ما فيش حركات في الفترة دي.</p></div></div>', { sub: String(list.length) });
  openSheet(esc(c.name), h);

function viewStats() {

  list.forEach(t => byW[t.walletId] = (byW[t.walletId] || 0) + t.amount);
  const wEnt = Object.entries(byW).sort((a, b) => b[1] - a[1]);

        name: esc(w.name), value: nf(v), sub: Math.round(v / T.exp * 100) + "%",
        cls: "rank", fill: (v / T.exp * 100).toFixed(1), fillColor: "var(--" + w.color + ")" });
    }).join("") + "</div>");
  }

  // مقارنة
  const cs = spendByRootIn(r, wf), ps = spendByRootIn(pr, wf);
  const ids = [...new Set([...Object.keys(cs), ...Object.keys(ps)])];
  const mov = ids.map(id => ({ c: catById(id), d: (cs[id] || 0) - (ps[id] || 0), a: cs[id] || 0, b: ps[id] || 0 }))
    .filter(m => Math.abs(m.d) > 0).sort((a, b) => Math.abs(b.d) - Math.abs(a.d)).slice(0, 5);

    })).join("") + "</div>");
  }

  // الدونت كعرض ثانوي
  const d = donutRange(r, wf);
  if (d) h += grp("التوزيع", '<div class="panel pad2">' + d.html + "</div>");

  h += '<div id="aiSlot"></div>';
  return h;
}

function wireCharts() {
  const pb = el("pbarsBox");
  if (pb) {
    const tt = el("pbarsTT");
    pb.querySelectorAll("path[data-k]").forEach(p => {
      const move = (ev) => {

      };
      p.addEventListener("pointermove", move); p.addEventListener("pointerenter", move);
      p.addEventListener("pointerleave", () => tt.classList.remove("on"));
      p.addEventListener("click", () => {
        const k = p.dataset.k;
        if (k.length > 7) { state.ui.period = "day"; state.ui.day = k; }

function splitAdd(name, amt) {

}
function splitRead() {
  return [...document.querySelectorAll("#splitRows .splitrow")].map(r => ({
    name: (r.querySelector(".sp-name").value || "").trim(),
    amount: parseFloat(r.querySelector(".sp-amt").value) || 0

function splitEqual() {
  const total = parseFloat(el("txAmt").value) || 0;
  if (!(total > 0)) return toast("اكتب المبلغ الكلي الأول");
  const n = clamp(parseInt(el("spCount").value, 10) || 2, 2, 20);
  el("spCount").value = n;
  const old = splitRead();
  const each = Math.round(total / n * 100) / 100;
  const box = el("splitRows"); box.innerHTML = "";
  for (let i = 0; i < n - 1; i++) box.insertAdjacentHTML("beforeend", splitRowHTML(old[i] ? old[i].name : "", each));
  splitSum();
}
function splitSum() {
  const box = el("spSum"); if (!box) return;
  const total = parseFloat(el("txAmt").value) || 0;
  const rows = splitRead().filter(r => r.amount > 0 || r.name);
  const theirs = rows.reduce((s, r) => s + r.amount, 0);
  const mine = total - theirs;
  const cur = esc(state.settings.currency);
  if (!total) { box.innerHTML = '<span class="sub">اكتب المبلغ الكلي فوق الأول.</span>'; return; }
  let out = "المبلغ الكلي <b>" + nf(total) + " " + cur + "</b><br>" +
    "عليهم <b>" + nf(theirs) + "</b> · نصيبك <b>" + nf(Math.max(0, mine)) + "</b>";
  if (mine < -0.004) out += '<br><span class="warnline">' + ico("alert") + " نصيبهم أكبر من المبلغ الكلي</span>";
  else if (Math.abs(mine) <= 0.004) out += "<br><span class=\"sub\">إنت دافع عنهم كله — مش هيتسجل عليك مصروف، كله سلف.</span>";
  else out += "<br><span class=\"sub\">هيتسجل <b>" + nf(mine) + "</b> مصروف عليك، والباقي سلف على " + people(rows.filter(r => r.amount > 0).length) + ".</span>";
  box.innerHTML = out;
}

    deadline: el("gDate").value || "", startedAt: todayISO()

  if (!(draft.target > 0)) { box.innerHTML = '<p class="sub" style="margin:0">اكتب المبلغ المستهدف وهنحسبلك الخطة على طول.</p>'; return; }

  if (m === "percent") rows.push(["النسبة من دخلك", nf(draft.pct) + "% من " + nf(inc)]);

function debtRow(d) {
  const left = d.closedAt ? 0 : debtLeft(d), paid = debtPaid(d), extra = debtExtra(d);
  const out = d.dir === "out";
  const pct = d.amount > 0 ? clamp(paid / d.amount * 100, 0, 100) : 0;
  const col = out ? "var(--s3)" : "var(--s4)";
  let badge;
  if (d.closedAt) badge = pill("flat", "اتقفل");
  else if (left <= 0.004) badge = pill("good", extra > 0 ? "رجع زيادة " + nf(extra) : "اترد بالكامل");
  else if (paid > 0) badge = pill("warn", "رجع " + nf(paid) + " من " + nf(d.amount));
  else badge = pill(out ? "warn" : "crit", out ? "لسه ما رجعش" : "لسه ما دفعتش");
  const age = daysBetween(d.date, todayISO());
  return '<div class="bud" style="border-bottom:1px solid var(--line)">' +
    '<div class="hd">' +
    '<span class="ic" style="background:color-mix(in srgb,' + col + ' 15%, var(--surface));color:' + col + '">' + ico(out ? "handOut" : "handIn") + "</span>" +
    '<span style="flex:1;min-width:0"><span class="nm" style="display:block">' + esc(d.person || "من غير اسم") + "</span>" +
    '<span class="mt" style="display:block;color:var(--muted);font-size:12px">' + (d.note ? esc(d.note) + " · " : "") + fmtDate(d.date) + (age > 0 ? " · من " + age + " يوم" : "") + "</span></span>" +
    '<span class="rt"><b style="color:' + (out ? "var(--up)" : "var(--down)") + '">' + nf(left || d.amount) + "</b><small>" + (left > 0 ? (out ? "ليك" : "عليك") : "من " + nf(d.amount)) + "</small></span></div>" +
    '<div class="bar thin"><i style="width:' + pct + "%;background:" + col + '"></i></div>' +
    '<div class="ftrow" style="padding-top:8px;align-items:center">' + badge +
    '<span class="btnrow" style="gap:6px">' +
    (left > 0.004 && !d.closedAt ? '<button class="btn" style="padding:6px 11px;font-size:13px" data-act="debtPay" data-id="' + d.id + '">' + ico("plus") + (out ? "رجّعلي" : "دفعت") + "</button>" : "") +
    '<button class="btn ghost" style="padding:6px 9px;font-size:13px" data-act="debtEdit" data-id="' + d.id + '">' + ico("edit") + "</button></span></div></div>";
}
function sheetDebts() {
  const t = debtTotals();
  const open = state.debts.filter(d => !d.closedAt && debtLeft(d) > 0.004);
  const done = state.debts.filter(d => d.closedAt || debtLeft(d) <= 0.004);
  const out = open.filter(d => d.dir === "out").sort((a, b) => a.date.localeCompare(b.date));
  const inn = open.filter(d => d.dir === "in").sort((a, b) => a.date.localeCompare(b.date));
  let h = '<div class="tiles" style="grid-template-columns:1fr 1fr;margin-bottom:14px">' +
    '<div class="tile"><div class="k">' + ico("handOut") + '<span>ليك عند الناس</span></div><div class="v up">' + nf(t.owedToMe) + "</div></div>" +
    '<div class="tile"><div class="k">' + ico("handIn") + '<span>عليك للناس</span></div><div class="v down">' + nf(t.iOwe) + "</div></div></div>" +
    '<div class="btnrow" style="margin-bottom:16px"><button class="btn pri" style="flex:1" data-act="newDebt" data-v="out">' + ico("handOut") + 'سلّفت حد</button>' +
    '<button class="btn" style="flex:1" data-act="newDebt" data-v="in">' + ico("handIn") + "استلفت</button></div>";
  if (!state.debts.length) {
    h += '<div class="card"><div class="empty"><div class="eic">' + ico("handOut") + "</div><h4>ما فيش سلف مسجلة</h4>" +
      "<p>لما تسلّف حد أو تدفع عنه، سجّلها هنا. الفلوس دي بتتشال من محفظتك بس <b>مش بتتحسب مصروف</b> — عشان تحليل صرفك يفضل مظبوط.</p></div></div>";
    return openSheet("سلف وديون", h);
  }
  // ملخص لكل شخص لما يكون عليه أكتر من سلفة
  const people = debtPeople().filter(p => p.out + p.in > 0.004);
  if (people.length > 1) {
    h += '<h2 class="sec" style="margin-top:0">الحساب مع كل حد</h2><div class="card list">' + people.map(p => {
      const net = p.out - p.in;
      const n = p.items.filter(debtOpen).length;
      return '<div class="item" style="cursor:default">' +
        '<span class="ic" style="background:color-mix(in srgb,var(--' + (net >= 0 ? "s3" : "s4") + ') 15%, var(--surface));color:var(--' + (net >= 0 ? "s3" : "s4") + ')">' + ico("users") + "</span>" +
        '<span style="flex:1;min-width:0"><span class="nm">' + esc(p.person) + '</span><span class="mt" style="display:block">' +
        (net >= 0 ? "ليك عنده" : "عليك له") + " · " + n + " سلفة</span></span>" +
        '<span class="amt" style="color:' + (net >= 0 ? "var(--up)" : "var(--down)") + '">' + nf(Math.abs(net)) + "</span></div>";
    }).join("") + "</div>";
  }
  if (out.length) h += '<h2 class="sec">ليك عند الناس<span class="hint">' + out.length + "</span></h2><div class=\"card\">" + out.map(debtRow).join("") + "</div>";
  if (inn.length) h += '<h2 class="sec">عليك للناس<span class="hint">' + inn.length + "</span></h2><div class=\"card\">" + inn.map(debtRow).join("") + "</div>";
  if (done.length) h += '<details class="more" style="margin-top:14px"><summary>خلصانة (' + done.length + ')</summary><div class="card" style="margin-top:10px">' +
    done.slice().reverse().slice(0, 25).map(debtRow).join("") + "</div></details>";
  openSheet("سلف وديون", h);
}

function addTxFromSheet(id) {
  const sh = el("sheet"), amt = parseFloat(el("txAmt").value);
  if (!(amt > 0)) return toast("اكتب مبلغ أكبر من صفر");
  const type = sh.dataset.type, transfer = type === "transfer";
  const date = el("txDate").value || todayISO();
  const note = el("txNote").value.trim().slice(0, 120);
  const from = sh.dataset.wallet;
  if (!from) return toast("اختار مكان الفلوس");
  let data;
  if (transfer) {
    const to = sh.dataset.towallet;
    if (!to || to === from) return toast("اختار مكانين مختلفين");
    data = { type: "transfer", amount: amt, fromWallet: from, toWallet: to, catId: "", walletId: "", date: date, note: note };
  } else {
    const cat = sh.dataset.cat; if (!cat) return toast("اختار البند");
    data = { type: type, amount: amt, catId: cat, walletId: from, fromWallet: "", toWallet: "", date: date, note: note };
  }
  // تقسيم الحساب: نصيب كل حد يتسجل سلفة مش مصروف
  let splitRows = null;
  if (!id && type === "expense" && sh.dataset.split === "1") {
    const rows = splitRead().filter(r => r.name || r.amount > 0);
    if (!rows.length) return toast("ضيف حد على الأقل، أو ألغي التقسيم");
    const bad = rows.find(r => !r.name);
    if (bad) return toast("في حد من غير اسم");
    const noAmt = rows.find(r => !(r.amount > 0));
    if (noAmt) return toast("اكتب نصيب " + noAmt.name);
    const theirs = rows.reduce((s, r) => s + r.amount, 0);
    if (theirs > amt + 0.004) return toast("مجموع نصيبهم أكبر من المبلغ الكلي");
    splitRows = rows.map(r => ({ name: r.name.slice(0, 40), amount: r.amount }));
    data.amount = Math.round((amt - theirs) * 100) / 100;
  }
  if (id) {
    const t = state.txs.find(x => x.id === id); if (!t) return;
    const oldMK = mkOf(t.date);
    Object.assign(t, data);
    save("m:" + oldMK); if (mkOf(date) !== oldMK) save("m:" + mkOf(date));
    toast("اتعدلت");
  } else {
    if (data.amount > 0.004) { state.txs.push(Object.assign({ id: uid("t"), at: Date.now() }, data)); save("m:" + mkOf(date)); }
    if (splitRows) {
      const label = note || catById(data.catId).name;
      splitRows.forEach(r => state.debts.push({
        id: uid("d"), dir: "out", person: r.name, amount: r.amount,
        walletId: from, date: date, note: label,
        payments: [], closedAt: "", at: Date.now()
      }));
      save("debts");
      const theirs = splitRows.reduce((s, r) => s + r.amount, 0);
      const who = splitRows.length === 1 ? splitRows[0].name : people(splitRows.length);
      toast(data.amount > 0.004
        ? "مصروف " + money2(data.amount) + " · و" + money2(theirs) + " ليك عند " + who
        : money2(theirs) + " ليك عند " + who + " — مش محسوبة مصروف");
    } else {
      toast(transfer ? "اتحوّل " + money2(amt) + " من " + walletById(from).name + " لـ " + walletById(data.toWallet).name
        : type === "income" ? "اتسجل دخل " + money2(amt) : "اتسجل مصروف " + money2(amt));
    }
  }
  if (mkOf(date) <= thisMK()) { state.ui.mk = mkOf(date); state.ui.day = date; state.ui.year = date.slice(0, 4); }
  closeSheet(); render();
}
function suggestLimits() {
  const inc = +state.settings.income || 0;
  if (!(inc > 0)) return toast("حدّد دخلك الشهري في الإعدادات الأول");
  const avail = inc * (1 - (+state.settings.savePct || 0) / 100);
  const totalPct = state.categories.reduce((s, c) => s + (+c.pct || 0), 0) || 100;
  state.categories.forEach(c => { c.limit = Math.round(avail * (+c.pct || 0) / totalPct / 5) * 5; });
  save("categories"); render();
  toast("اتحطت حدود مقترحة — عدّلها زي ما تحب");
}
/* ---------- backup & restore ---------- */
async function saveFile(name, text, mime) {
  mime = mime || "application/json";
  let dl = null;
  try { dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null; } catch (_) { }
  if (dl) {
    try { await dl.save({ filename: name, data: text }); return "saved"; }
    catch (e) { if (e && e.code === "cancelled") return "cancelled"; }
  }
  if (!window.claude) {
    const ext = "." + name.split(".").pop();
    if (window.showSaveFilePicker) {
      try {
        const h = await window.showSaveFilePicker({ suggestedName: name, types: [{ description: ext === ".csv" ? "ملف CSV" : "ملف نسخة احتياطية", accept: { [mime]: [ext] } }] });
        const w = await h.createWritable();
        await w.write(new Blob([text], { type: mime + ";charset=utf-8" }));
        await w.close();
        return "saved";
      } catch (e) { if (e && (e.name === "AbortError" || e.name === "NotAllowedError")) return "cancelled"; }
    }
    try {
      const url = URL.createObjectURL(new Blob([text], { type: mime + ";charset=utf-8" }));
      const a = document.createElement("a");
      a.href = url; a.download = name; document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
      return "downloads";
    } catch (_) { }
  }
  try { await navigator.clipboard.writeText(text); return "clipboard"; }
  catch (_) { return "failed"; }
}
function backupPayload() {
  return Object.assign({ app: "masroufy", v: 2, savedAt: new Date().toISOString() }, dataBundle());
}
function cleanName(n, ext) {
  n = (n || "").trim().replace(/[\\/:*?"<>|]/g, "-").slice(0, 60) || "masroufy-backup-" + todayISO();
  if (!n.toLowerCase().endsWith(ext)) n += ext;
  return n;
}
async function exportBackup() {

  if (r === "saved" || r === "downloads") {
    state.settings.lastBackup = new Date().toISOString();
    save("settings");
    toast(r === "downloads" ? "نزّلنا « " + name + " » في مجلد التنزيلات" : "اتحفظت النسخة في « " + name + " »");

  } else if (r === "clipboard") toast("مقدرناش نحفظ ملف — نسخنا البيانات للحافظة، الزقها في ملف نصي");

async function exportCSV() {
  const rows = [["التاريخ", "النوع", "البند", "المبلغ", "ملاحظة"]];

function backupAgeDays() {

function applyRestore(mode) {
  const d = pendingRestore; if (!d) return;
  const touched = new Set(state.txs.map(t => mkOf(t.date)));
  migrate(d);
  if (mode === "replace") {
    applyData(d);
    state.settings.onboarded = true;
  } else {
    const known = new Set(state.txs.map(t => t.id));
    d.txs.forEach(t => { if (t && t.id && !known.has(t.id)) { state.txs.push(t); known.add(t.id); } });
    (d.wallets || []).forEach(w => { if (w && w.id && !state.wallets.some(x => x.id === w.id)) state.wallets.push(w); });
    (d.categories || []).forEach(c => { if (c && c.id && !state.categories.some(x => x.id === c.id)) state.categories.push(c); });
    (d.goals || []).forEach(g => { if (g && g.id && !state.goals.some(x => x.id === g.id)) state.goals.push(g); });
    (d.debts || []).forEach(x => { if (x && x.id && !state.debts.some(y => y.id === x.id)) state.debts.push(x); });
  }
  state.txs.forEach(t => touched.add(mkOf(t.date)));
  save("settings", "wallets", "categories", "goals", "debts");
  touched.forEach(mk => save("m:" + mk));
  pendingRestore = null;
  closeSheet(); render();
  toast(mode === "replace" ? "رجّعنا النسخة — " + nf(state.txs.length) + " حركة" : "دمجنا النسخة — إجمالي " + nf(state.txs.length) + " حركة");
}

const Install = { prompt: null, dismissed: false };
const LS_INST = "masroufy.install.hide";

function isStandalone() {
  try {
    return window.matchMedia("(display-mode: standalone)").matches ||
      window.matchMedia("(display-mode: fullscreen)").matches ||
      navigator.standalone === true;
  } catch (_) { return false; }
}
function envInfo() {
  const ua = navigator.userAgent || "";
  const ios = /iphone|ipad|ipod/i.test(ua) && !window.MSStream;
  const android = /android/i.test(ua);
  const inApp = /\bwv\b|WhatsApp|FBAN|FBAV|FB_IAB|Instagram|Line\/|Twitter|MicroMessenger|TikTok|Snapchat|Telegram/i.test(ua);
  const iosOtherBrowser = ios && /CriOS|FxiOS|EdgiOS|OPiOS/i.test(ua);
  const desktop = !ios && !android;
  let app = "";
  if (/WhatsApp/i.test(ua)) app = "واتساب";
  else if (/FBAN|FBAV|FB_IAB/i.test(ua)) app = "فيسبوك";
  else if (/Instagram/i.test(ua)) app = "إنستجرام";
  else if (/Telegram/i.test(ua)) app = "تيليجرام";
  else if (/MicroMessenger/i.test(ua)) app = "وي شات";
  return { ios: ios, android: android, inApp: inApp, iosOtherBrowser: iosOtherBrowser, desktop: desktop, app: app };
}
function installHidden() { try { return localStorage.getItem(LS_INST) === "1"; } catch (_) { return false; } }
function hideInstall() { try { localStorage.setItem(LS_INST, "1"); } catch (_) { } Install.dismissed = true; }

function installState() {
  if (isStandalone()) return "installed";
  const e = envInfo();
  if (e.inApp) return "inapp";
  if (Install.prompt) return "ready";
  if (e.ios) return e.iosOtherBrowser ? "ios-wrong" : "ios";
  if (e.desktop) return "desktop";
  return "manual";
}

const Upd = { reg: null, waiting: null, swVersion: "", checking: false, lastCheck: 0, supported: false, reloading: false };

function updBanner(show) {
  const b = el("updBar");
  if (!show) { b.hidden = true; return; }
  b.innerHTML = '<span class="ui">' + ico("down") + "</span>" +
    '<span class="ut"><b>في إصدار جديد جاهز</b>دوس حدّث عشان تاخده دلوقتي</span>' +
    '<button data-act="updNow">حدّث</button>' +
    '<button class="later" data-act="updLater" aria-label="بعدين">' + ico("x") + "</button>";
  b.hidden = false;
}
function watchWorker(w) {
  if (!w) return;
  w.addEventListener("statechange", () => {
    if (w.state === "installed" && navigator.serviceWorker.controller) {
      Upd.waiting = w; updBanner(true);
      if (state.ui.tab === "settings") render();
    }
  });
}
async function swSetup() {
  if (!("serviceWorker" in navigator)) return;
  Upd.supported = true;
  try {
    const reg = await navigator.serviceWorker.register("./sw.js");
    Upd.reg = reg;
    if (reg.waiting && navigator.serviceWorker.controller) { Upd.waiting = reg.waiting; updBanner(true); }
    if (reg.installing) watchWorker(reg.installing);
    reg.addEventListener("updatefound", () => watchWorker(reg.installing));
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      if (Upd.reloading) return;
      Upd.reloading = true; location.reload();
    });
    navigator.serviceWorker.addEventListener("message", (e) => {
      if (e.data && e.data.type === "VERSION") {
        Upd.swVersion = e.data.version;
        if (state.ui.tab === "settings") render();
      }
    });
    if (navigator.serviceWorker.controller) navigator.serviceWorker.controller.postMessage({ type: "GET_VERSION" });
    // فحص عند كل فتح، وكل ساعة لو التطبيق فاضل مفتوح
    setTimeout(() => checkUpdate(true), 1500);
    setInterval(() => checkUpdate(true), 3600000);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) checkUpdate(true); });
  } catch (e) { Upd.supported = false; }
}
async function checkUpdate(silent) {
  if (!Upd.reg) { if (!silent) toast("التحديث التلقائي مش شغال هنا"); return; }
  if (Upd.checking) return;
  if (silent && Date.now() - Upd.lastCheck < 60000) return;
  Upd.checking = true; Upd.lastCheck = Date.now();
  if (!silent && state.ui.tab === "settings") render();
  try {
    await Upd.reg.update();
    await new Promise(r => setTimeout(r, 900));
    if (Upd.reg.waiting && navigator.serviceWorker.controller) { Upd.waiting = Upd.reg.waiting; updBanner(true); }
    else if (!silent) toast("إنت على آخر إصدار (" + APP_VERSION + ")");
  } catch (e) {
    if (!silent) toast("مقدرناش نتأكد — اتأكد إن في نت");
  }
  Upd.checking = false;
  if (state.ui.tab === "settings") render();
}
function applyUpdate() {
  const w = Upd.waiting || (Upd.reg && Upd.reg.waiting);
  if (!w) { location.reload(); return; }
  toast("بنحدّث…");
  w.postMessage({ type: "SKIP_WAITING" });
  setTimeout(() => { if (!Upd.reloading) { Upd.reloading = true; location.reload(); } }, 1800);
}

let sampleNS = undefined;
async function mountAI() {
  const slot = el("aiSlot"); if (!slot) return;
  if (sampleNS === undefined) { try { sampleNS = window.claude && window.claude.use ? await window.claude.use("sample") : null; } catch (_) { sampleNS = null; } }
  if (!sampleNS) return;
  if (!el("aiSlot")) return;
  el("aiSlot").innerHTML = '<h2 class="sec">تحليل مكتوب لمصاريفك</h2><div class="card pad">' +
    '<p class="sub" style="margin:0 0 12px">اضغط عشان نقرا أرقام آخر شهرين ونكتبلك تحليل وخطوات عملية تقلل بيها الصرف.</p>' +
    '<button class="btn pri block" data-act="runAI">' + ico("bolt") + 'حلّل مصاريفي</button><div id="aiOut" class="aiout" style="margin-top:12px"></div></div>';
}
async function runAI() {
  const out = el("aiOut"), btn = document.querySelector('[data-act="runAI"]');
  if (!sampleNS || !out) return;
  btn.disabled = true; out.textContent = "بنقرا الأرقام…";
  const wfa = statWSet();
  const mk = state.ui.mk, prev = mkShift(mk, -1);
  const pack = (m) => {
    const rr = rangeOf("month", m), T = totalsIn(rr, wfa), sc = spendByCatIn(rr, wfa);
    return { month: m, income: Math.round(T.inc), expense: Math.round(T.exp), byCategory: Object.entries(sc).map(([id, v]) => ({ name: catById(id).name, amount: Math.round(v), limit: +catById(id).limit || 0 })) };
  };
  const B = balanceNow(), ckN = monthClock(mk);
  const data = {
    currency: state.settings.currency, monthlyIncome: +state.settings.income || 0, savingTargetPct: +state.settings.savePct || 0,
    balance: Math.round(B.total),
    wallets: state.wallets.map(w => ({ name: w.name, balance: Math.round(B.byWallet[w.id] || 0) })),
    dayOfMonth: ckN.day, daysInMonth: ckN.dim,
    scope: wfa ? "الأرقام دي من " + statWLabel() + " بس، مش كل فلوسه" : "كل أماكن فلوسه",
    avgPerDay: Math.round(ckN.day > 0 ? totalsIn(rangeOf("month", mk), wfa).exp / ckN.day : 0),
    spentToday: Math.round(spentOnDay(todayISO(), wfa)),
    current: pack(mk), previous: pack(prev),
    goals: state.goals.map(g => { const s = goalStatus(g); return { name: g.name, target: g.target, saved: Math.round(goalSaved(g)), deadline: g.deadline || null, neededMonthly: Math.round(s.need || 0) }; })
  };
  const prompt = "إنت مستشار مالي شخصي بتكلم مصري بالعامية المصرية البسيطة. جاتلك بيانات مصاريف شخص بالجنيه. " +
    "اكتب تحليل قصير ومفيد في 4 أقسام بعناوين واضحة: (1) الخلاصة في سطرين، (2) أكتر 3 حاجات بتاكل فلوسه وليه، " +
    "(3) 4 خطوات عملية بأرقام محددة يقدر ينفذها الشهر الجاي عشان يوفر — واحدة منهم على الأقل عن معدل صرفه اليومي، " +
    "(4) هل هيقدر يوصل لأهدافه ولا لأ وإيه المطلوب. " +
    "استخدم أرقام من البيانات نفسها، ما تخترعش أرقام، وما تكتبش مقدمات أو اعتذارات. البيانات:\n" + JSON.stringify(data);
  try {
    const res = await sampleNS(prompt, { modelTier: "default", onText: ({ text }) => { out.textContent = text; } });
    out.textContent = res.text;
  } catch (e) {
    out.textContent = "";
    toast(e && e.code === "rate_limited" ? "استنى شوية وجرب تاني" : "مقدرناش نعمل التحليل دلوقتي");
  } finally { if (btn) btn.disabled = false; }
}
